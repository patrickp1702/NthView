  "lead": "A remote MCP server guards something useful, such as your tickets, documents or repositories, and will not hand it to just any program. When Claude Code connects, the server refuses the first request and points at where its sign-in rules are published. Claude then walks the OAuth 2.1 path: discover the authorization server, send you to a browser to approve, trade the resulting code for a token, and retry with that token attached. This explainer follows every request on that path and what each version of the specification changed.",

          "id": "challenge",
          "title": "The 401 challenge",
          "subtitle": "No token, no service",
          "article": {
            "body": [
              "Claude does not know in advance whether a server wants a token. It simply sends the first MCP request, `initialize`, and lets the server answer. A server that requires authorization replies **401 Unauthorized** with a `WWW-Authenticate` header, the standard HTTP way of saying \"you need credentials, and here is what kind\".",
              "Since the June 2025 revision the header also carries a `resource_metadata` URL. That one pointer removes all configuration: Claude fetches the document, learns which authorization server protects this MCP server and what scopes exist, and can start the sign-in without anyone typing a URL."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "MCP authorization",
                "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization"
              },
              {
                "label": "RFC 9728 · Protected resource metadata",
                "url": "https://www.rfc-editor.org/rfc/rfc9728"
              },
              {
                "label": "RFC 6750 · Bearer tokens",
                "url": "https://www.rfc-editor.org/rfc/rfc6750"
              }
            ],
            "versionNotes": [
              {
                "version": "2025-03-26",
                "heading": "In 2025-03-26",
                "items": [
                  "A bare 401. The client assumes the MCP server is also the authorization server and looks for metadata at the server's own origin."
                ]
              },
              {
                "version": "2025-06-18",
                "items": [
                  "The 401 carries `resource_metadata`, a URL to the protected resource metadata document (RFC 9728).",
                  "The MCP server is a resource server only; the authorization server may be anyone."
                ]
              }
            ]
          },

                        "clientInfo": {

                          "version": "2.x"
                        }
                      }
                    }

                    }

        {
          "id": "discovery",
          "title": "Discover the authorization server",
          "subtitle": "Metadata says where to go",
          "article": {
            "body": [
              "An OAuth authorization server describes itself in a JSON document at a well-known path (RFC 8414). It lists the endpoints a client needs, the code challenge methods it accepts and the ways a client may register. Claude fetches it once per server and caches it.",
              "Two details matter for MCP. The server **must** support PKCE with `S256`; a client refuses to continue without it. And the metadata may name a registration endpoint, which decides how Claude will identify itself in the next topic."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "RFC 8414 · Authorization server metadata",
                "url": "https://www.rfc-editor.org/rfc/rfc8414"
              },
              {
                "label": "OpenID Connect Discovery",
                "url": "https://openid.net/specs/openid-connect-discovery-1_0.html"
              }
            ]
          },
          "steps": [
            {
              "title": "Fetch the authorization server metadata",
              "explanation": "Claude takes the authorization server's URL and asks for its well-known metadata. OpenID-style discovery at a different path is tried as a fallback.",
              "messages": [
                {
                  "from": "claude",
                  "to": "auth",
                  "name": "GET /.well-known/oauth-authorization-server",
                  "info": "RFC 8414 metadata",
                  "size": "110 B"
                },
                {
                  "from": "auth",
                  "to": "claude",
                  "name": "200 OK",
                  "info": "endpoints, S256, registration",
                  "kind": "response",
                  "size": "640 B",
                  "payload": {
                    "issuer": "https://auth.example.com",
                    "authorization_endpoint": "https://auth.example.com/authorize",
                    "token_endpoint": "https://auth.example.com/token",
                    "registration_endpoint": "https://auth.example.com/register",
                    "response_types_supported": [
                      "code"
                    ],
                    "grant_types_supported": [
                      "authorization_code",
                      "refresh_token"
                    ],
                    "code_challenge_methods_supported": [
                      "S256"
                    ],
                    "token_endpoint_auth_methods_supported": [
                      "none",
                      "client_secret_basic"
                    ],
                    "scopes_supported": [
                      "mcp:tools",
                      "mcp:resources"
                    ]
                  },
                  "annotations": [
                    {
                      "field": "issuer",
                      "text": "The server's identity. Claude keys stored tokens by it, so two servers behind different issuers never mix."
                    },
                    {
                      "field": "code_challenge_methods_supported",
                      "text": "Must include `S256`. Without PKCE an intercepted code could be redeemed by someone else."
                    },
                    {
                      "field": "registration_endpoint",
                      "text": "Present when the server accepts dynamic client registration; optional."
                    },
                    {
                      "field": "token_endpoint_auth_methods_supported",
                      "text": "`none` means a public client like Claude, which cannot keep a secret, may use the token endpoint with PKCE alone."
                    }
                  ]
                }
              ]
            },
            {
              "title": "Check the essentials",
              "explanation": "Before anything leaves the machine, Claude checks that the metadata supports the authorization code grant with PKCE S256 and notes the endpoints it will use.",
              "messages": [
                {
                  "from": "claude",
                  "to": "claude",
                  "name": "verify metadata",
                  "info": "code grant, S256, endpoints present",
                  "kind": "local",
                  "payload": "response_types_supported     includes \"code\"        ok\ncode_challenge_methods       includes \"S256\"        ok\nauthorization_endpoint       https://auth.example.com/authorize\ntoken_endpoint               https://auth.example.com/token\nregistration_endpoint        https://auth.example.com/register   (optional)"
                }
              ]
            }
          ]
        },
        {
          "id": "registration",
          "title": "Identify the client",
          "subtitle": "Dynamic registration or a metadata document",
          "article": {
            "body": [
              "OAuth was designed for apps that register with a service by hand and receive a `client_id`. MCP clients connect to servers nobody registered them with, so the spec needs a way for a client to introduce itself on the fly. The first answer was **dynamic client registration** (RFC 7591): post a description, receive a `client_id`.",
              "The November 2025 revision added **client ID metadata documents**: the `client_id` is itself an `https` URL under the client publisher's control, and the authorization server fetches the client's description from it. No registration call, no per-server state, and the server can see who publishes the client.",
              "Claude keeps whichever `client_id` it ended up with, per authorization server, next to the tokens."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "RFC 7591 · Dynamic client registration",
                "url": "https://www.rfc-editor.org/rfc/rfc7591"
              },
              {
                "label": "MCP authorization · client registration",
                "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization"
              }
            ],
            "versionNotes": [
              {
                "version": "2025-11-25",
                "items": [
                  "Client ID metadata documents: the `client_id` is an `https` URL the authorization server dereferences for the client's metadata.",
                  "Dynamic registration remains available; a client may offer both."
                ]
              }
            ]
          },
          "steps": [
            {
              "title": "Register dynamically",
              "explanation": "If the metadata lists a registration endpoint, Claude posts a short description of itself and receives a client id for this authorization server. Public clients get no secret.",
              "messages": [
                {
                  "from": "claude",
                  "to": "auth",
                  "name": "POST /register",
                  "info": "client name, redirect URIs, no secret",
                  "size": "280 B",
                  "payload": {
                    "client_name": "Claude Code",
                    "redirect_uris": [
                      "http://localhost:52341/callback"
                    ],
                    "grant_types": [
                      "authorization_code",
                      "refresh_token"
                    ],
                    "response_types": [
                      "code"
                    ],
                    "token_endpoint_auth_method": "none"
                  },
                  "annotations": [
                    {
                      "field": "redirect_uris",
                      "text": "A loopback address on your machine. The browser will be sent back here with the code; only a program on this machine can receive it."
                    },
                    {
                      "field": "token_endpoint_auth_method",
                      "text": "`none`: a desktop client cannot hide a secret, so it authenticates the code exchange with PKCE instead."
                    }
                  ]
                },
                {
                  "from": "auth",
                  "to": "claude",
                  "name": "201 Created",
                  "info": "client_id for this server",
                  "kind": "response",
                  "payload": {
                    "client_id": "cid_8f2a…",
                    "client_id_issued_at": 1764000000,
                    "redirect_uris": [
                      "http://localhost:52341/callback"
                    ],
                    "token_endpoint_auth_method": "none"
                  },
                  "annotations": [
                    {
                      "field": "client_id",
                      "text": "Meaningful only to this authorization server. Claude stores it next to the tokens, keyed by issuer."
                    }
                  ]
                }
              ]
            },
            {
              "title": "Or present a client ID metadata document",
              "explanation": "Instead of registering, Claude can use an https URL as its client id. The authorization server fetches the document behind it, finds the client's name and redirect URIs, and treats the publisher of that URL as the party to trust.",
              "messages": [
                {
                  "from": "claude",
                  "to": "claude",
                  "name": "client_id = https://client.example/.well-known/oauth-client",
                  "info": "an https URL under the publisher's control",
                  "kind": "local",
                  "tags": [
                    "new"
                  ]
                },
                {
                  "from": "auth",
                  "to": "auth",
                  "name": "GET client_id URL",
                  "info": "fetch and validate the client metadata document",
                  "kind": "local",
                  "tags": [
                    "new"
                  ],
                  "payload": {
                    "client_id": "https://client.example/.well-known/oauth-client",
                    "client_name": "Claude Code",
                    "redirect_uris": [
                      "http://localhost:52341/callback"
                    ],
                    "token_endpoint_auth_method": "none",
                    "grant_types": [
                      "authorization_code",
                      "refresh_token"
                    ]
                  },
                  "annotations": [
                    {
                      "field": "client_id",
                      "text": "Must equal the URL the document was fetched from. The server trusts the domain owner to describe their own client."
                    },
                    {
                      "field": "redirect_uris",
                      "text": "The server only redirects to URIs listed here, so a document published by the real client publisher protects its users."
                    }
                  ]
                }
              ],
              "versions": {
                "2025-03-26": {
                  "title": "Not yet specified",
                  "explanation": "Client ID metadata documents arrive in the 2025-11-25 revision. In this revision a client registers dynamically or has a pre-configured client id.",
                  "messages": []
                },
                "2025-06-18": {
                  "title": "Not yet specified",
                  "explanation": "Client ID metadata documents arrive in the 2025-11-25 revision. In this revision a client registers dynamically or has a pre-configured client id.",
                  "messages": []
                }
              }
            }
          ]
        },
        {
          "id": "signin",
          "title": "Sign in with PKCE",
          "subtitle": "The browser does the talking",
          "article": {
            "body": [
              "Claude never asks for your password. It opens the authorization server's page in your browser, you sign in there, and the server sends the browser back to Claude with a one-time **authorization code**. The code is useless on its own: whoever redeems it must also present the **code verifier**, a random secret Claude generated before opening the browser and only ever sends over the back channel. The browser carried only its hash, the code challenge.",
              "From the June 2025 revision the request also names the **resource** the token is for, so the authorization server can mint a token that works at that MCP server and nowhere else."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "RFC 7636 · PKCE",
                "url": "https://www.rfc-editor.org/rfc/rfc7636"
              },
              {
                "label": "RFC 8707 · Resource indicators",
                "url": "https://www.rfc-editor.org/rfc/rfc8707"
              },
              {
                "label": "OAuth 2.1 draft",
                "url": "https://datatracker.ietf.org/doc/html/draft-ietf-oauth-v2-1"
              }
            ],
            "versionNotes": [
              {
                "version": "2025-06-18",
                "items": [
                  "The authorization request carries `resource=` with the MCP server's URL (RFC 8707), so the token is audience-bound."
                ]
              }
            ]
          },
          "steps": [
            {
              "title": "Make a PKCE pair",
              "explanation": "Claude draws a long random string, the code verifier, and hashes it into the code challenge. Only the challenge will leave the machine through the browser; the verifier stays until the token request.",
              "messages": [
                {
                  "from": "claude",
                  "to": "claude",
                  "name": "generate code_verifier and code_challenge",
                  "info": "43–128 random characters; S256 hash",
                  "kind": "local",
                  "payload": "code_verifier   = 43–128 chars from [A-Z a-z 0-9 - . _ ~], kept secret\ncode_challenge  = BASE64URL( SHA-256( code_verifier ) )\nstate           = random, to match the callback to this request"
                }
              ]
            },
            {
              "title": "Open the browser",
              "explanation": "Claude starts a tiny web server on a loopback port to catch the callback, then opens the authorization URL in your default browser.",
              "messages": [
                {
                  "from": "claude",
                  "to": "browser",
                  "name": "open /authorize?…",
                  "info": "code challenge, redirect to localhost, resource",
                  "kind": "transport",
                  "versions": [
                    "2025-06-18",
                    "2025-11-25"
                  ],

      "title": "Break it: attacks and defences",
      "topics": [
        {
          "id": "passthrough",
          "title": "Token passthrough",
          "subtitle": "The confused deputy",
          "article": {
            "body": [
              "Many MCP servers are thin wrappers around another API. The tempting shortcut is to take the token Claude sent and forward it upstream. The spec forbids it: the token's audience is the MCP server, not the upstream API, and an upstream that accepts it cannot tell whether the request was authorised for this purpose. A server that forwards tokens becomes a **confused deputy**, lending its authority to whoever can reach it.",
              "The right design is two tokens: Claude's token proves the user to the MCP server, and the MCP server obtains its own credentials for the upstream, by token exchange, by its own client credentials, or by a separate consent for the upstream. Each token means one thing to one audience."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "MCP security best practices",
                "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/security_best_practices"
              },
              {
                "label": "RFC 8693 · Token exchange",
                "url": "https://www.rfc-editor.org/rfc/rfc8693"
              }
            ],
            "versionNotes": [
              {
                "version": "2025-06-18",
                "items": [
                  "Token passthrough is explicitly forbidden; servers must validate that a token was issued for them.",
                  "A security best practices document accompanies the authorization spec."
                ]
              }
            ],
            "boxes": [
              {
                "title": "Rule of thumb",
                "tone": "attention",
                "items": [
                  {
                    "text": "A token has one audience. If you did not mint or request it for the service you are calling, do not send it there."
                  }
                ]
              }
            ]
          },
          "steps": [
            {
              "title": "The tempting shortcut",
              "explanation": "The MCP server receives a tool call with Claude's bearer token and simply forwards that token to the upstream API. The upstream either rejects it for the wrong audience or, worse, accepts it without knowing who approved what.",
              "check": {
                "prompt": "The MCP server must call a third-party API on your behalf. What may it do with the token Claude sent?",
                "options": [
                  {
                    "text": "Validate it for its own use and obtain its own token for the upstream",
                    "correct": true,
                    "why": "Right. Claude's token proves the user to the MCP server only. The server gets separate credentials for the upstream, so every token has exactly one audience."
                  },
                  {
                    "text": "Forward it as it is, since you already consented",
                    "why": "You consented to the MCP server, not to every service it talks to. Forwarding makes the server a confused deputy and is forbidden by the spec."
                  },
                  {
                    "text": "Forward it after checking that its scope covers the API",
                    "why": "Scope is not audience. Even a token with a matching scope was minted for the MCP server, and the upstream cannot tell how the request was authorised."
                  }
                ]
              },
              "messages": [
                {
                  "from": "claude",
                  "to": "mcp",
                  "name": "tools/call",
                  "info": "list_repos, Authorization: Bearer at_…",
                  "size": "210 B"
                },
                {
                  "from": "mcp",
                  "to": "upstream",
                  "name": "GET /repos",
                  "info": "Authorization: Bearer at_… (Claude's token)",
                  "tags": [
                    "forbidden"
                  ],
                  "payload": "GET /repos HTTP/1.1\nHost: api.example.net\nAuthorization: Bearer at_2YotnFZFEjr1zCsicMWpAA…   \u003c- minted for mcp.example.com, not for api.example.net",
                  "annotations": [
                    {
                      "field": "Authorization",
                      "text": "The wrong token for this audience. An upstream that checks audiences rejects it; one that does not has just been fooled."
                    }
                  ]
                },
                {
                  "from": "upstream",
                  "to": "mcp",
                  "name": "401 Unauthorized",
                  "info": "invalid_token: wrong audience",
                  "kind": "error"
                }
              ]
            },

              "title": "The right way",
              "explanation": "The MCP server validates Claude's token for itself, then gets its own token for the upstream, here by exchanging the user's token at the authorization server, and calls the upstream with that.",

                  "from": "mcp",

                  "info": "token for api.example.net",

                    "token_type": "Bearer",
                    "expires_in": 600

                },

                  "from": "mcp",
                  "to": "upstream",
                  "name": "GET /repos",
                  "info": "Authorization: Bearer at_up_… (its own token)"

                  "from": "upstream",

        {
          "id": "audience",
          "title": "Audience binding",
          "subtitle": "Why resource indicators exist",
          "availableFrom": "2025-06-18",
          "article": {
            "body": [
              "A bearer token is only as safe as the set of places that accept it. If one token worked at every MCP server behind the same authorization server, a rogue server you were tricked into connecting to could take the token you sent it and replay it at the real one. **Resource indicators** (RFC 8707) close that hole: the client names the server it wants a token for, the authorization server records that audience in the token, and every server rejects tokens whose audience is not itself.",
              "This is why the June 2025 revision made the `resource` parameter mandatory in both the authorization and the token request, and why servers must check it."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "RFC 8707 · Resource indicators",
                "url": "https://www.rfc-editor.org/rfc/rfc8707"
              },
              {
                "label": "MCP security best practices",
                "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/security_best_practices"
              }
            ],
            "versionNotes": [
              {
                "version": "2025-06-18",
                "items": [
                  "`resource` is required in the authorization and token requests; tokens carry an audience and servers must check it."
                ]
              }
            ]
          },
          "steps": [
            {
              "title": "A token minted for one server",
              "explanation": "Because Claude named the resource when it asked, the token it holds carries that server as its audience.",
              "messages": [
                {
                  "from": "claude",
                  "to": "auth",
                  "name": "POST /token",
                  "info": "resource=https://mcp.example.com/mcp"
                },
                {
                  "from": "auth",
                  "to": "claude",
                  "name": "200 OK",
                  "info": "token with aud = mcp.example.com",
                  "kind": "response",

  function injectStyles() {
    if (root.document.getElementById(STYLE_ID)) return;
    var style = root.document.createElement("style");
    style.id = STYLE_ID;
    style.textContent = CSS;
    root.document.head.appendChild(style);
  }

  function el(tag, attrs, children) {
    var node = root.document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }

  function renderErrorPanel(container, result) {
    var items = result.errors.map(function (e) {
      return el("li", {}, [el("code", { text: e.path }), root.document.createTextNode(": " + e.message)]);
    });
    container.appendChild(el("div", { class: "nthview-error-panel", role: "alert" }, [
      el("h2", { text: "This view could not be built" }),
      el("p", { text: "The data has " + result.errors.length + " problem(s). Fix them and rebuild the file." }),
      el("ul", {}, items)
    ]));
  }

  // ---- progress storage (identical in every view, §5.5) ------------------
  var STORE_VERSION = 1;
  function storageKey(data) {
    var s = JSON.stringify(data), h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return "nthview:dataflow:" + (h >>> 0).toString(36);
  }
  function loadState(key) {
    try { var raw = root.localStorage.getItem(key); if (!raw) return null; var st = JSON.parse(raw); return st && st.v === STORE_VERSION ? st : null; }
    catch (e) { return null; }
  }
  function saveState(key, state) {
    try { state.v = STORE_VERSION; state.savedAt = Date.now(); root.localStorage.setItem(key, JSON.stringify(state)); }
    catch (e) { /* storage unavailable or full: keep playing without saving */ }
  }
  function clearState(key) { try { root.localStorage.removeItem(key); } catch (e) {} }
  function restartButton(container, data, key) {
    var b = el("button", { type: "button", class: "nthview-restart", text: "Restart", title: "Start again from the beginning" });
    b.addEventListener("click", function () {
      if (!root.confirm("Start again from the beginning? Your progress here will be erased.")) return;
      clearState(key);
      NthView.build(container, data);
    });
    return b;
  }

  // ---- SVG helpers ---------------------------------------------------------
  var SVG_NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs, children) {
    var node = root.document.createElementNS(SVG_NS, tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }

    function updatePlayBtn() {

    /* ---------- checks ---------- */
