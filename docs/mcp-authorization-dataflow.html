  "kicker": "OAuth 2.1 · Model Context Protocol",
  "heading": "How an agent gets access and refresh tokens",
  "lead": "An agent such as Claude Code wants to use a remote MCP server that holds your data. The server will not serve a stranger, and you should never type your password into the agent. OAuth solves this with four roles and one short dance: the agent discovers who issues tokens for the server, sends **you** to a browser to sign in and approve, receives a one-time code, and trades that code for two tokens. The **access token** goes on every request and dies within an hour. The **refresh token** lives longer and quietly buys new access tokens. Eight numbered topics follow every message in order and show exactly what each one carries.",

    },
    {
      "term": "Resource server",

    },
    {
      "term": "Authorization server",

    },
    {
      "term": "Refresh token",

      "topics": [
        {
          "id": "challenge",
          "title": "1 · Connect and get challenged",
          "subtitle": "The first request has no token and is refused",
          "article": {
            "body": [
              "Nothing in OAuth starts with a login screen. It starts with the client simply trying. Claude sends the first MCP request, `initialize`, with no credentials at all. A server that requires authorization answers **401 Unauthorized** and adds a `WWW-Authenticate` header: the HTTP way of saying \"you need a bearer token, and here is where to learn how to get one\".",
              "What is passed matters. The request carries the MCP protocol version and the client's name. The 401 carries one URL, `resource_metadata`, pointing at a small JSON document the server publishes about itself. That single pointer is what makes the rest automatic: no server URL to configure, no list of identity providers built into the agent."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "MCP authorization",
                "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization"
              },
              {
                "label": "RFC 6750 · Bearer tokens",
                "url": "https://www.rfc-editor.org/rfc/rfc6750"
              }
            ],
            "versionNotes": [
              {
                "version": "2025-06-18",
                "items": [
                  "The 401 carries `resource_metadata`, a URL to the protected resource metadata document (RFC 9728).",
                  "Before this revision the 401 was bare and the client assumed the MCP server issued its own tokens."
                ]
              }
            ]
          },
          "steps": [
            {
              "title": "You add the server",
              "explanation": "You tell Claude about a remote MCP server by its URL. Nothing else: no username, no password, no key. Claude will work out how to get in by asking the server itself.",
              "messages": [
                {
                  "from": "user",
                  "to": "claude",
                  "name": "add server https://mcp.example.com/mcp",
                  "info": "carries: the server URL only",
                  "kind": "transport",
                  "holds": {
                    "claude": {
                      "add": [
                        "server URL"
                      ]
                    }
                  }
                }
              ]
            },

              "title": "Claude knocks without a token",

                  "from": "claude",

                        "clientInfo": {
                          "name": "claude-code",
                          "version": "2.x"
                        }
                      }
                    }
                  },

                    },
                    {

                    }
                  ]
                }
              ]

          "id": "discovery",
          "title": "2 · Discover where to sign in",
          "subtitle": "Two metadata documents name every endpoint",
          "article": {
            "body": [
              "OAuth servers describe themselves in JSON documents at well-known URLs, so a client never needs them configured. There are two. The **protected resource metadata** belongs to the MCP server and says: this is my identifier, these are the authorization servers that protect me, these are the scopes I understand. The **authorization server metadata** (RFC 8414) belongs to the authorization server and lists its endpoints: where to send the browser (`authorization_endpoint`), where to exchange codes for tokens (`token_endpoint`), where a client may register, and which code challenge methods it accepts.",
              "Claude reads both, checks that the authorization server supports PKCE with `S256`, and now knows every URL it will need for the rest of the flow."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "RFC 9728 · Protected resource metadata",
                "url": "https://www.rfc-editor.org/rfc/rfc9728"
              },
              {
                "label": "RFC 8414 · Authorization server metadata",
                "url": "https://www.rfc-editor.org/rfc/rfc8414"
              }
            ]
          },
          "steps": [
            {
              "title": "Read the protected resource metadata",
              "explanation": "Claude fetches the URL from the 401. The MCP server answers with its own identifier, the list of authorization servers that protect it and the scopes it understands. Claude now knows which authorization server to talk to.",
              "messages": [
                {
                  "from": "claude",
                  "to": "mcp",
                  "name": "GET /.well-known/oauth-protected-resource",
                  "info": "carries: nothing; a plain GET",
                  "size": "120 B"
                },
                {
                  "from": "mcp",
                  "to": "claude",
                  "name": "200 OK · resource metadata",
                  "info": "carries: resource, authorization_servers, scopes_supported",
                  "kind": "response",
                  "size": "310 B",
                  "payload": {
                    "resource": "https://mcp.example.com/mcp",
                    "authorization_servers": [
                      "https://auth.example.com"
                    ],
                    "scopes_supported": [
                      "mcp:tools",
                      "mcp:resources"
                    ],

                      "header"
                    ]

                  "annotations": [

                      "field": "resource",
                      "text": "The server's identifier. Claude will ask for tokens bound to exactly this value, so a token for this server works nowhere else."
                    },
                    {
                      "field": "authorization_servers",
                      "text": "Who issues tokens for this server. Claude picks one and fetches its metadata next."
                    },
                    {
                      "field": "scopes_supported",
                      "text": "The permissions the server understands; Claude requests a subset at sign-in."
                    },
                    {
                      "field": "bearer_methods_supported",
                      "text": "`header` only: the token goes in the Authorization header, never in a URL."
                    }
                  ],
                  "holds": {
                    "claude": {
                      "add": [
                        "authorization server URL",
                        "scopes offered"
                      ]
                    }
                  }
                }
              ],
              "versions": {

                  "title": "Assume the server issues its own tokens",

              "title": "Fetch the authorization server metadata",
              "explanation": "Claude asks the authorization server for its well-known metadata. The answer carries the issuer name and the three endpoints the flow needs: authorize, token and register, plus the PKCE methods and the grant types it supports.",

                  "to": "auth",

                  "info": "carries: nothing; a plain GET",
                  "size": "110 B"

                  "from": "auth",
                  "to": "claude",
                  "name": "200 OK · server metadata",
                  "info": "carries: issuer, authorization/token/registration endpoints, S256, grant types",

                  "payload": {
                    "issuer": "https://auth.example.com",
                    "authorization_endpoint": "https://auth.example.com/authorize",
                    "token_endpoint": "https://auth.example.com/token",
                    "registration_endpoint": "https://auth.example.com/register",
                    "response_types_supported": [
                      "code"
                    ],
                    "grant_types_supported": [
                      "authorization_code",
                      "refresh_token"
                    ],
                    "code_challenge_methods_supported": [
                      "S256"
                    ],
                    "token_endpoint_auth_methods_supported": [
                      "none",
                      "client_secret_basic"
                    ],
                    "scopes_supported": [
                      "mcp:tools",
                      "mcp:resources"
                    ]

                  "annotations": [

                      "field": "issuer",
                      "text": "The server's identity. Claude stores tokens keyed by it, so two servers behind different issuers never mix."

                      "field": "authorization_endpoint",
                      "text": "Where the browser is sent in topic 4."

                      "field": "token_endpoint",

        {
          "id": "registration",
          "title": "3 · Introduce the client",
          "subtitle": "How Claude gets a client_id",
          "article": {
            "body": [
              "Every OAuth client has a `client_id`, a public name the authorization server knows it by. Web apps get one when a developer registers them by hand. An agent connects to servers nobody registered it with, so MCP needs a way to introduce a client on the fly. **Dynamic client registration** (RFC 7591) does this: Claude posts a short description of itself, including the loopback address it will listen on, and receives a `client_id` in return. Public clients like Claude get no secret, because a program on a laptop cannot keep one.",
              "The November 2025 revision added a second way, **client ID metadata documents**: the `client_id` is itself an `https` URL under the client publisher's control, and the authorization server fetches the client's description from there. No registration call, and the server can see who publishes the client."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "RFC 7591 · Dynamic client registration",
                "url": "https://www.rfc-editor.org/rfc/rfc7591"
              },
              {
                "label": "MCP authorization · client registration",
                "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization"
              }
            ],
            "versionNotes": [
              {
                "version": "2025-11-25",
                "items": [
                  "Client ID metadata documents: the `client_id` is an `https` URL the authorization server dereferences for the client's metadata.",
                  "Dynamic registration remains available."
                ]
              }
            ]
          },
          "steps": [
            {
              "title": "Register dynamically",
              "explanation": "Claude posts its description to the registration endpoint: a display name, the loopback redirect URI where the browser should come back, the grant types it will use, and token_endpoint_auth_method none. The server answers with the client_id Claude will use from now on.",
              "messages": [
                {
                  "from": "claude",
                  "to": "auth",
                  "name": "POST /register",
                  "info": "carries: client_name, redirect_uris, grant_types, auth method none",
                  "size": "280 B",
                  "payload": {
                    "client_name": "Claude Code",
                    "redirect_uris": [
                      "http://localhost:52341/callback"
                    ],
                    "grant_types": [
                      "authorization_code",
                      "refresh_token"
                    ],
                    "response_types": [
                      "code"
                    ],
                    "token_endpoint_auth_method": "none"
                  },
                  "annotations": [
                    {
                      "field": "redirect_uris",
                      "text": "A loopback address on your machine. The browser will be sent back here with the code; only a program on this machine can receive it."
                    },
                    {
                      "field": "grant_types",
                      "text": "Claude declares both grants it will use: the code exchange now and refresh later."
                    },
                    {
                      "field": "token_endpoint_auth_method",
                      "text": "`none`: no client secret. PKCE will prove that the code exchange comes from the same program that started the sign-in."
                    }
                  ]
                },
                {
                  "from": "auth",
                  "to": "claude",
                  "name": "201 Created · client_id",
                  "info": "carries: client_id, the registered redirect URIs",
                  "kind": "response",
                  "payload": {
                    "client_id": "cid_8f2a…",
                    "client_id_issued_at": 1764000000,
                    "redirect_uris": [
                      "http://localhost:52341/callback"
                    ],
                    "token_endpoint_auth_method": "none"
                  },
                  "annotations": [
                    {
                      "field": "client_id",
                      "text": "Public, not secret. Meaningful only to this authorization server; Claude stores it next to the tokens."
                    }
                  ],
                  "holds": {
                    "claude": {
                      "add": [
                        "client_id"
                      ]
                    },
                    "auth": {
                      "add": [
                        "client record"
                      ]
                    }
                  }
                }
              ]
            },

                  "start": 0,
                  "end": 0
                },
                {
                  "condition": "the client publishes a metadata document",
                  "start": 1,
                  "end": 1
                }
              ]
            }
          ]
        },
        {
          "id": "signin",
          "title": "4 · Authorize in the browser",
          "subtitle": "You sign in; Claude receives a one-time code",
          "article": {
            "body": [
              "This is the only part you see. Claude opens the authorization server's page in your browser. You sign in there, with your password, a passkey or your company's single sign-on, and approve what Claude may do. The authorization server then sends the browser back to a loopback address on your machine with a one-time **authorization code**. Claude never sees your password; it receives only the code.",
              "Two values protect the code. **PKCE**: before opening the browser, Claude generates a random **code verifier** and sends only its hash, the **code challenge**, in the URL. Whoever later redeems the code must present the verifier, which never travelled through the browser. **state**: a random value that comes back with the code so Claude can tell the callback belongs to the request it made. Since the June 2025 revision the request also names the **resource**, the MCP server the token is for."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "RFC 7636 · PKCE",
                "url": "https://www.rfc-editor.org/rfc/rfc7636"
              },
              {
                "label": "RFC 8707 · Resource indicators",
                "url": "https://www.rfc-editor.org/rfc/rfc8707"
              },
              {
                "label": "OAuth 2.1 draft",
                "url": "https://datatracker.ietf.org/doc/html/draft-ietf-oauth-v2-1"
              }
            ],
            "versionNotes": [
              {
                "version": "2025-06-18",
                "items": [
                  "The authorization request carries `resource=` with the MCP server's identifier, so the token is bound to one server."
                ]
              }
            ]
          },
          "steps": [
            {
              "title": "Generate the PKCE pair and a state value",
              "explanation": "Claude draws a long random string, the code verifier, and keeps it secret. It hashes it with SHA-256 into the code challenge, which is safe to show in a URL. It also draws a random state value to recognise the callback later.",
              "messages": [
                {
                  "from": "claude",
                  "to": "claude",
                  "name": "generate code_verifier, code_challenge, state",
                  "info": "verifier stays on the machine; the challenge is its hash",
                  "kind": "local",
                  "payload": "code_verifier   = 43–128 random chars from [A-Z a-z 0-9 - . _ ~]   (secret, kept)\ncode_challenge  = BASE64URL( SHA-256( code_verifier ) )         (goes in the URL)\nstate           = random string                                 (matches the callback to this request)",
                  "holds": {
                    "claude": {
                      "add": [
                        "code_verifier",
                        "state"
                      ]
                    }
                  }
                }
              ]
            },
            {
              "title": "Open the authorization URL",
              "explanation": "Claude starts a tiny web server on a loopback port to catch the callback, then opens the authorization endpoint in your browser. The URL carries: response_type code, Claude's client_id, the loopback redirect URI, the code challenge and its method, the resource (the MCP server), the scopes it wants, and the state.",
              "messages": [
                {
                  "from": "claude",
                  "to": "browser",
                  "name": "open /authorize?…",
                  "info": "carries: client_id, redirect_uri, code_challenge, resource, scope, state",
                  "kind": "transport",
                  "versions": [
                    "2025-06-18",
                    "2025-11-25"
                  ],
                  "payload": "https://auth.example.com/authorize\n  ?response_type=code\n  &client_id=cid_8f2a…\n  &redirect_uri=http://localhost:52341/callback\n  &code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM\n  &code_challenge_method=S256\n  &resource=https://mcp.example.com/mcp\n  &scope=mcp:tools mcp:resources\n  &state=af0ifjsldkj",
                  "annotations": [
                    {
                      "field": "response_type",
                      "text": "`code`: Claude wants an authorization code, not a token, in the browser. The token comes later over the back channel."
                    },
                    {
                      "field": "client_id",
                      "text": "Who is asking, from topic 3."
                    },
                    {
                      "field": "redirect_uri",
                      "text": "Where the browser must be sent back with the code: a loopback address only a program on your machine can receive."
                    },
                    {
                      "field": "code_challenge",
                      "text": "The hash of the verifier. Seeing it in the browser history gives an attacker nothing."
                    },
                    {
                      "field": "resource",
                      "text": "The MCP server's identifier from topic 2. The token will be minted for that server only."
                    },
                    {
                      "field": "scope",
                      "text": "What Claude asks permission for; you see these on the consent page."
                    },
                    {
                      "field": "state",
                      "text": "Echoed back by the server so Claude can match the callback to this request."
                    }
                  ]
                },
                {
                  "from": "claude",
                  "to": "browser",
                  "name": "open /authorize?…",
                  "info": "carries: client_id, redirect_uri, code_challenge, state",
                  "kind": "transport",
                  "versions": [
                    "2025-03-26"
                  ],
                  "payload": "https://mcp.example.com/authorize\n  ?response_type=code\n  &client_id=cid_8f2a…\n  &redirect_uri=http://localhost:52341/callback\n  &code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM\n  &code_challenge_method=S256\n  &state=af0ifjsldkj",
                  "annotations": [
                    {
                      "field": "resource",
                      "text": "Not present in this revision: tokens were not yet bound to one MCP server."
                    }
                  ]
                }
              ]
            },
            {
              "title": "You sign in and consent",
              "explanation": "The browser loads the authorization server's page. You prove who you are to that server, never to Claude, and the page lists what Claude asked for: the scopes. You approve. The browser posts your consent back to the authorization server.",
              "messages": [
                {
                  "from": "browser",
                  "to": "auth",
                  "name": "GET /authorize?…",
                  "info": "carries: the full URL Claude opened",
                  "holds": {
                    "auth": {
                      "add": [
                        "code_challenge",
                        "redirect_uri",
                        "state"
                      ]
                    }
                  }
                },
                {
                  "from": "auth",
                  "to": "browser",
                  "name": "200 · sign-in and consent page",
                  "info": "carries: the server's own login form and the requested scopes",
                  "kind": "response"
                },
                {
                  "from": "user",
                  "to": "browser",
                  "name": "sign in, then approve",
                  "info": "carries: your password or passkey, to the authorization server only",
                  "kind": "transport"
                },
                {
                  "from": "browser",
                  "to": "auth",
                  "name": "POST /authorize · consent",
                  "info": "carries: your approval of mcp:tools and mcp:resources",
                  "holds": {
                    "auth": {
                      "add": [
                        "your consent"
                      ]
                    }
                  }
                }
              ]
            },
            {
              "title": "The code comes back to Claude",
              "explanation": "The authorization server redirects the browser to the loopback address with two values: the one-time authorization code and the state. Claude's tiny server receives them, checks that the state matches, and tells the browser the tab can be closed. The code alone is worthless: redeeming it needs the verifier Claude kept.",
              "messages": [
                {
                  "from": "auth",
                  "to": "browser",
                  "name": "302 Found → localhost callback",
                  "info": "carries: code, state in the Location URL",
                  "kind": "response",
                  "payload": "HTTP/1.1 302 Found\nLocation: http://localhost:52341/callback?code=SplxlOBeZQQYbYS6WxSbIA&state=af0ifjsldkj",
                  "annotations": [
                    {
                      "field": "code",
                      "text": "The authorization code: single use, short-lived, typically under a minute. Useless without the code verifier."
                    },
                    {
                      "field": "state",
                      "text": "The same value Claude sent. A callback with a different state is ignored."
                    }
                  ],
                  "holds": {
                    "auth": {
                      "add": [
                        "authorization code (pending)"
                      ]
                    }
                  }
                },
                {
                  "from": "browser",
                  "to": "claude",
                  "name": "GET /callback?code=…&state=…",
                  "info": "carries: code, state to Claude's loopback server",
                  "holds": {
                    "claude": {
                      "add": [
                        "authorization code"
                      ]
                    }
                  }
                },
                {
                  "from": "claude",
                  "to": "claude",
                  "name": "check state",
                  "info": "must equal the state from step 1",
                  "kind": "local",
                  "holds": {
                    "claude": {
                      "remove": [
                        "state"
                      ]
                    }
                  }
                },
                {
                  "from": "claude",
                  "to": "browser",
                  "name": "200 OK · \"you can close this tab\"",
                  "info": "carries: a short confirmation page",
                  "kind": "response"
                }
              ]
            }
          ],
          "holds": {
            "claude": [
              "client_id",
              "AS endpoints"
            ]
          }
        },
        {
          "id": "token",
          "title": "5 · Exchange the code for tokens",
          "subtitle": "Back channel: code + verifier in, access and refresh tokens out",
          "article": {
            "body": [
              "Now the browser is out of the picture. Claude talks to the authorization server's token endpoint directly over HTTPS. It sends the code it received, the same redirect URI it used, its client_id, the **code verifier** and the **resource**. The server hashes the verifier, compares it with the challenge it saw when the sign-in started, checks the code is unused and unexpired, and only then answers.",
              "The answer is the goal of the whole flow. The **access token** is a bearer credential: whoever presents it is served, which is why it is scoped, short-lived and bound to one audience. The **refresh token** is a longer-lived secret that lets Claude obtain a new access token later without a browser. Claude stores both in the operating system's credential store, keyed by the authorization server and the MCP server."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "OAuth 2.1 draft · token endpoint",
                "url": "https://datatracker.ietf.org/doc/html/draft-ietf-oauth-v2-1"
              },
              {
                "label": "RFC 8707 · Resource indicators",
                "url": "https://www.rfc-editor.org/rfc/rfc8707"
              }
            ]
          },
          "steps": [
            {
              "title": "Send the code and the verifier",
              "explanation": "Claude posts to the token endpoint: grant_type authorization_code, the code, the redirect URI used, its client_id, the code verifier and the resource. The verifier is the proof: only the program that generated the challenge can produce it.",
              "messages": [
                {
                  "from": "claude",
                  "to": "auth",
                  "name": "POST /token",
                  "info": "carries: grant_type, code, redirect_uri, client_id, code_verifier, resource",
                  "size": "320 B",
                  "versions": [
                    "2025-06-18",
                    "2025-11-25"
                  ],
                  "payload": "POST /token HTTP/1.1\nHost: auth.example.com\nContent-Type: application/x-www-form-urlencoded\n\ngrant_type=authorization_code\n&code=SplxlOBeZQQYbYS6WxSbIA\n&redirect_uri=http://localhost:52341/callback\n&client_id=cid_8f2a…\n&code_verifier=dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk\n&resource=https://mcp.example.com/mcp",
                  "annotations": [
                    {
                      "field": "grant_type",
                      "text": "`authorization_code`: exchange a code for tokens."
                    },
                    {
                      "field": "code",
                      "text": "The one-time code from topic 4."
                    },
                    {
                      "field": "redirect_uri",
                      "text": "Must match the one used in the authorization request; a mismatch is refused."
                    },
                    {
                      "field": "code_verifier",
                      "text": "The secret from topic 4, step 1. The server checks BASE64URL(SHA-256(verifier)) equals the stored code_challenge."
                    },
                    {
                      "field": "resource",
                      "text": "Repeated so the issued token is bound to this MCP server."
                    },
                    {
                      "field": "client_id",
                      "text": "No client secret: a public client authenticates with PKCE alone."
                    }
                  ],
                  "holds": {
                    "auth": {
                      "remove": [
                        "code_challenge",
                        "authorization code (pending)"
                      ]
                    },
                    "claude": {
                      "remove": [
                        "authorization code",
                        "code_verifier"
                      ]
                    }
                  }
                },
                {
                  "from": "claude",
                  "to": "auth",
                  "name": "POST /token",
                  "info": "carries: grant_type, code, redirect_uri, client_id, code_verifier",
                  "size": "270 B",
                  "versions": [
                    "2025-03-26"
                  ],
                  "payload": "POST /token HTTP/1.1\nHost: mcp.example.com\nContent-Type: application/x-www-form-urlencoded\n\ngrant_type=authorization_code\n&code=SplxlOBeZQQYbYS6WxSbIA\n&redirect_uri=http://localhost:52341/callback\n&client_id=cid_8f2a…\n&code_verifier=dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk",
                  "holds": {
                    "auth": {
                      "remove": [
                        "code_challenge",
                        "authorization code (pending)"
                      ]
                    },
                    "claude": {
                      "remove": [
                        "authorization code",
                        "code_verifier"
                      ]
                    }
                  }
                }
              ]
            },
            {
              "title": "Receive the access token and the refresh token",
              "explanation": "The authorization server answers with the two tokens. The access token, its type Bearer, its lifetime in seconds, the scope actually granted, and the refresh token. From here on Claude is authorized.",
              "messages": [
                {
                  "from": "auth",
                  "to": "claude",
                  "name": "200 OK · tokens",
                  "info": "carries: access_token, token_type, expires_in, refresh_token, scope",
                  "kind": "response",
                  "size": "480 B",
                  "payload": {
                    "access_token": "at_2YotnFZFEjr1zCsicMWpAA…",
                    "token_type": "Bearer",
                    "expires_in": 3600,
                    "refresh_token": "rt_tGzv3JOkF0XG5Qx2TlKWIA…",
                    "scope": "mcp:tools mcp:resources"
                  },
                  "annotations": [
                    {
                      "field": "access_token",
                      "text": "What Claude sends on every request to the MCP server. Opaque to Claude; the server knows how to validate it. Its audience is the MCP server named in `resource`."
                    },
                    {
                      "field": "token_type",
                      "text": "`Bearer`: present it as `Authorization: Bearer \u003ctoken>`."
                    },
                    {
                      "field": "expires_in",
                      "text": "Seconds until the access token dies, here one hour. Short lifetimes limit the damage of a leak."
                    },
                    {
                      "field": "refresh_token",
                      "text": "Lets Claude get a new access token without a browser. It is the more valuable secret and goes in the keychain."
                    },
                    {
                      "field": "scope",
                      "text": "What was actually granted; it may be less than what was asked."
                    }
                  ],
                  "holds": {
                    "claude": {
                      "add": [
                        "access token (1 h)",
                        "refresh token"
                      ]
                    },
                    "auth": {
                      "add": [
                        "refresh token record"
                      ]
                    }
                  }
                }
              ]
            },
            {
              "title": "Store both tokens safely",
              "explanation": "Claude saves the tokens in the operating system's credential store, keyed by the authorization server's issuer and the MCP server's resource identifier, together with the client_id. Nothing is written to a project file.",
              "messages": [
                {
                  "from": "claude",
                  "to": "claude",
                  "name": "store credentials",
                  "info": "OS keychain, keyed by issuer and resource",
                  "kind": "local",
                  "payload": "keychain entry\n  issuer         https://auth.example.com\n  resource       https://mcp.example.com/mcp\n  client_id      cid_8f2a…\n  access_token   at_…        expires 2025-11-25T10:42Z\n  refresh_token  rt_…",
                  "holds": {
                    "claude": {
                      "add": [
                        "keychain entry"
                      ]
                    }
                  }
                }
              ]
            }
          ],
          "holds": {
            "claude": [
              "client_id",
              "AS endpoints",
              "code_verifier",
              "authorization code"
            ],
            "auth": [
              "code_challenge",
              "authorization code (pending)",
              "your consent"
            ]
          }
        },
        {
          "id": "use",
          "title": "6 · Use the access token",
          "subtitle": "Every MCP request now carries Authorization: Bearer",
          "article": {
            "body": [
              "With a token in hand, Claude repeats the very first request, this time with an `Authorization: Bearer` header. The MCP server validates the token: its signature or introspection result, its expiry, its scope, and above all its **audience**, which must be this server. Then the ordinary MCP session begins: initialize, list tools, call tools, each request carrying the same header.",
              "The token is opaque to Claude. It does not read it, parse it or forward it anywhere; it only presents it to the one server it was minted for."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "RFC 6750 · Bearer token usage",
                "url": "https://www.rfc-editor.org/rfc/rfc6750"
              }
            ]
          },
          "steps": [
            {
              "title": "Retry the first request with the bearer token",
              "explanation": "The same initialize request as in topic 1, now with the header Authorization: Bearer and the access token. Everything else is unchanged.",
              "messages": [
                {
                  "from": "claude",
                  "to": "mcp",
                  "name": "POST /mcp · initialize",
                  "info": "carries: Authorization: Bearer \u003caccess token>, the initialize body",
                  "kind": "transport",
                  "payload": "POST /mcp HTTP/1.1\nHost: mcp.example.com\nAuthorization: Bearer at_2YotnFZFEjr1zCsicMWpAA…\nContent-Type: application/json\n\n{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-11-25\",\"capabilities\":{},\"clientInfo\":{\"name\":\"claude-code\",\"version\":\"2.x\"}}}",
                  "annotations": [
                    {
                      "field": "Authorization",
                      "text": "The bearer token, in the header only. Never in the URL, never in the JSON body."
                    }
                  ]
                }
              ]
            },
            {
              "title": "The server validates the token",
              "explanation": "The MCP server checks the token before running anything: the issuer's signature or an introspection call, the expiry time, the scope the request needs, and that the audience is this very server. A token minted for another server is rejected here.",
              "messages": [
                {
                  "from": "mcp",
                  "to": "mcp",
                  "name": "validate token",
                  "info": "signature, expiry, scope, audience = this server",
                  "kind": "local",
                  "payload": "signature   issuer's key                  ok\nexpiry      not before now                ok\naudience    https://mcp.example.com/mcp   ok   (anything else: reject)\nscope       mcp:tools mcp:resources       ok"
                }
              ]
            },
            {
              "title": "The MCP session proceeds",
              "explanation": "The server answers initialize as any MCP server would, and Claude goes on to list and call tools. Every one of those requests carries the same Authorization header until the token expires.",
              "messages": [
                {
                  "from": "mcp",
                  "to": "claude",
                  "name": "200 OK · initialize result",
                  "info": "carries: protocolVersion, server capabilities, serverInfo",
                  "kind": "response",
                  "payload": {
                    "jsonrpc": "2.0",
                    "id": 1,
                    "result": {
                      "protocolVersion": "2025-11-25",
                      "capabilities": {
                        "tools": {
                          "listChanged": true
                        },
                        "resources": {}
                      },
                      "serverInfo": {
                        "name": "tickets-mcp",
                        "version": "1.4.0"
                      }
                    }
                  },
                  "holds": {
                    "claude": {
                      "add": [
                        "MCP session"
                      ]
                    }
                  }
                },
                {
                  "from": "claude",
                  "to": "mcp",
                  "name": "POST /mcp · tools/list",
                  "info": "carries: Authorization: Bearer, the tools/list request",
                  "kind": "transport"
                },
                {
                  "from": "mcp",
                  "to": "claude",
                  "name": "200 OK · tools",
                  "info": "carries: the server's tools",
                  "kind": "response"
                }
              ]
            }
          ],
          "holds": {
            "claude": [
              "client_id",
              "access token (1 h)",
              "refresh token"
            ]
          },
          "fragments": [
            {
              "kind": "loop",
              "label": "the session",
              "condition": "for every request while the access token is valid",
              "start": 2,
              "end": 2
            }
          ]
        },
        {
          "id": "refresh",
          "title": "7 · Refresh when the access token expires",
          "subtitle": "The refresh token buys a new access token, silently",
          "article": {
            "body": [
              "Access tokens are deliberately short-lived. When one expires the MCP server answers **401** again, this time with `error=\"invalid_token\"`. Claude does not reopen the browser. It posts the **refresh token** to the token endpoint with `grant_type=refresh_token` and receives a fresh access token, and often a fresh refresh token too. Then it retries the request that failed. You notice nothing.",
              "Many servers rotate refresh tokens: each use returns a new one and invalidates the old. Claude replaces the stored one every time. If the refresh token itself is revoked or expired, the server answers an error and Claude falls back to the full browser sign-in from topic 4."
            ],
            "referencesLabel": "Spec",
            "references": [
              {
                "label": "OAuth 2.1 draft · refreshing an access token",
                "url": "https://datatracker.ietf.org/doc/html/draft-ietf-oauth-v2-1"
              }
            ]
          },
          "steps": [
            {
              "title": "The access token has expired",
              "explanation": "An hour later a request fails. The server answers 401 with error invalid_token and a description. This is a different 401 from topic 1: Claude has credentials, they are just stale.",
              "messages": [
                {
                  "from": "claude",
                  "to": "mcp",
                  "name": "POST /mcp · tools/call",
                  "info": "carries: Authorization: Bearer \u003cexpired access token>",
                  "kind": "transport"
                },
                {
                  "from": "mcp",
                  "to": "claude",
                  "name": "401 Unauthorized",
                  "info": "carries: WWW-Authenticate: Bearer error=\"invalid_token\"",
                  "kind": "error",
                  "payload": "HTTP/1.1 401 Unauthorized\nWWW-Authenticate: Bearer error=\"invalid_token\", error_description=\"The access token expired\"",
                  "annotations": [
                    {
                      "field": "error",
                      "text": "`invalid_token` means the credential is unusable; `error_description` says why. Claude tries the refresh token before anything else."
                    }
                  ],
                  "holds": {
                    "claude": {
                      "remove": [
                        "access token (1 h)"
                      ]
                    }
                  }
                }
              ]
            },
            {
              "title": "Send the refresh token",
              "explanation": "Claude posts to the token endpoint with grant_type refresh_token, the refresh token, its client_id and the resource. No browser, no user interaction.",
              "messages": [
                {
                  "from": "claude",
                  "to": "auth",
                  "name": "POST /token",
                  "info": "carries: grant_type=refresh_token, refresh_token, client_id, resource",
                  "payload": "POST /token HTTP/1.1\nHost: auth.example.com\nContent-Type: application/x-www-form-urlencoded\n\ngrant_type=refresh_token\n&refresh_token=rt_tGzv3JOkF0XG5Qx2TlKWIA…\n&client_id=cid_8f2a…\n&resource=https://mcp.example.com/mcp",
                  "annotations": [
                    {
                      "field": "grant_type",
                      "text": "`refresh_token`: trade a refresh token for a new access token."
                    },
                    {
                      "field": "refresh_token",
                      "text": "The long-lived secret from topic 5. It is sent only here, only to the token endpoint, only over HTTPS."
                    },
                    {
                      "field": "resource",
                      "text": "The new access token must be bound to the same MCP server."
                    }
                  ]
                }
              ]
            },
            {
              "title": "New tokens, then retry",
              "explanation": "The authorization server answers with a new access token and, when it rotates, a new refresh token. Claude replaces both in the keychain and retries the failed request with the new access token.",
              "messages": [
                {
                  "from": "auth",
                  "to": "claude",
                  "name": "200 OK · new tokens",
                  "info": "carries: access_token, expires_in, and often a new refresh_token",
                  "kind": "response",
                  "payload": {

          if (CI[c.id]) error(p + ".id", "duplicate channel id " + JSON.stringify(c.id)); else CI[c.id] = true;
        }
        requireString(c, "name", p, 1, 40, error);
        if (c.color === undefined) error(p + ".color", "must be one of " + COLORS.join(", ") + ", got undefined (missing)");
        else optionalEnum(c, "color", p, COLORS, error);
        optionalString(c, "description", p, 200, error);
      });
    }
    function checkChannelRef(obj, key, parent) {
      var path = join(parent, key), v = obj[key];
      if (typeof v !== "string") { error(path, "must be a channel id string, got " + describe(v)); return false; }
      if (!CI[v]) { error(path, "channel id " + JSON.stringify(v) + " is not defined in channels"); return false; }
      channelUsed[v] = true;
      return true;
    }
    if (Array.isArray(data.links)) data.links.forEach(function (l, i) { if (isObject(l) && l.channel !== undefined) checkChannelRef(l, "channel", "links[" + i + "]"); });

    /* sections and topics */
    var TI = {}, topicCount = 0, stepCount = 0, checkCount = 0;
    if (requireArray(data, "sections", "$", 1, 12, error)) {
      data.sections.forEach(function (s, si) {
        var sp = "sections[" + si + "]";
        if (!isObject(s)) { error(sp, "must be an object, got " + describe(s)); return; }
        requireString(s, "title", sp, 1, 60, error);
        if (!requireArray(s, "topics", sp, 1, MAX_TOPICS, error)) return;
        s.topics.forEach(function (t, ti) {
          topicCount++;
          checkTopic(t, sp + ".topics[" + ti + "]");
        });
      });
      if (topicCount > MAX_TOPICS) error("sections", "must have at most " + MAX_TOPICS + " topics in all, got " + topicCount);
      if (topicCount < 2) warn("sections", "fewer than 2 topics in all; the sidebar will be very short");
    }

    function checkTopic(t, p) {
      if (!isObject(t)) { error(p, "must be an object, got " + describe(t)); return; }
      if (requireId(t, "id", p, error)) {
        if (TI[t.id]) error(p + ".id", "duplicate topic id " + JSON.stringify(t.id)); else TI[t.id] = true;
      }
      requireString(t, "title", p, 1, 60, error);
      requireString(t, "subtitle", p, 1, 80, error);
      optionalString(t, "tag", p, 20, error);
      var okFrom = t.availableFrom !== undefined && checkVersionRef(t, "availableFrom", p);
      var okTo = t.removedIn !== undefined && checkVersionRef(t, "removedIn", p);
      if (okFrom && okTo && VI[t.removedIn] <= VI[t.availableFrom]) error(p + ".removedIn", "must be a later version than availableFrom (" + JSON.stringify(t.availableFrom) + ")");

      if (!isObject(t.article)) error(p + ".article", "must be an object, got " + describe(t.article));
      else checkArticle(t.article, p + ".article");

      if (t.holds !== undefined) {
        if (!isObject(t.holds)) error(p + ".holds", "must be an object keyed by entity id, got " + describe(t.holds));
        else Object.keys(t.holds).forEach(function (id) {
          if (!EI[id]) error(p + ".holds." + id, "entity id " + JSON.stringify(id) + " is not defined in entities");
          checkItems(t.holds, id, p + ".holds", 0, MAX_HOLDS);
        });
      }

      var touched = {};
      if (requireArray(t, "steps", p, 1, 30, error)) {
        var msgTotal = 0;
        t.steps.forEach(function (st, i) { msgTotal += checkStep(st, p + ".steps[" + i + "]", touched); });
        if (t.steps.length > 12) warn(p + ".steps", "more than 12 steps (" + t.steps.length + "); consider splitting the topic");
        if (msgTotal > 60) warn(p + ".steps", "more than 60 messages in this topic (" + msgTotal + "); the flow table gets long");
        if (Object.keys(touched).length > 8) warn(p, "the steps touch " + Object.keys(touched).length + " entities; the network diagram will be crowded");
        checkHoldings(t, p);
        if (t.fragments !== undefined) checkFragments(t, p);
      }
    }

    /* Holdings are cumulative: walk the messages each version shows and make sure every removed item is held. */
    function checkHoldings(t, p) {
      var versionIds = hasVersions ? versions.map(function (v) { return v.id; }) : [null];
      /* the same problem is reported once, naming the versions only when it does not occur in all of them */
      var found = {}, order = [];
      function report(kind, path, message, vid) {
        var key = kind + " " + path;
        if (!found[key]) { found[key] = { kind: kind, path: path, message: message, versions: [] }; order.push(key); }
        if (vid) found[key].versions.push(vid);
      }
      versionIds.forEach(function (vid) {
        var held = {};
        Object.keys(EI).forEach(function (id) {
          var e = null;
          data.entities.forEach(function (x) { if (isObject(x) && x.id === id) e = x; });
          var start = (t.holds && isObject(t.holds) && Array.isArray(t.holds[id])) ? t.holds[id] : (e && Array.isArray(e.holds) ? e.holds : []);
          held[id] = start.slice();
        });
        t.steps.forEach(function (st, si) {
          if (!isObject(st)) return;
          var ov = (vid && isObject(st.versions) && isObject(st.versions[vid])) ? st.versions[vid] : null;
          var msgs = ov && Array.isArray(ov.messages) ? ov.messages : (Array.isArray(st.messages) ? st.messages : []);
          var base = ov && Array.isArray(ov.messages) ? p + ".steps[" + si + "].versions." + vid + ".messages" : p + ".steps[" + si + "].messages";
          msgs.forEach(function (m, mi) {
            if (!isObject(m) || !isObject(m.holds)) return;
            if (vid && Array.isArray(m.versions) && m.versions.indexOf(vid) === -1) return;
            Object.keys(m.holds).forEach(function (id) {
              var ch = m.holds[id], hp = base + "[" + mi + "].holds." + id;
              if (!isObject(ch) || !held[id]) return;
              (Array.isArray(ch.remove) ? ch.remove : []).forEach(function (item, k) {
                var at = held[id].indexOf(item);
                if (at === -1) report("error", hp + ".remove[" + k + "]", JSON.stringify(item) + " is not held by " + JSON.stringify(id) + " at this point", vid);
                else held[id].splice(at, 1);
              });
              (Array.isArray(ch.add) ? ch.add : []).forEach(function (item, k) {
                if (held[id].indexOf(item) !== -1) report("warn", hp + ".add[" + k + "]", JSON.stringify(id) + " already holds " + JSON.stringify(item), vid);
                else held[id].push(item);
              });
              if (held[id].length > MAX_HOLDS) report("warn", hp, JSON.stringify(id) + " holds " + held[id].length + " items here; more than " + MAX_HOLDS + " is hard to read", vid);
            });
          });
        });
      });
      order.forEach(function (key) {
        var f = found[key], suffix = f.versions.length && f.versions.length < versionIds.length ? " (in version " + f.versions.map(JSON.stringify).join(", ") + ")" : "";
        (f.kind === "error" ? error : warn)(f.path, f.message + suffix);
      });
    }

    function checkFragments(t, p) {
      if (!requireArray(t, "fragments", p, 0, 12, error)) return;
      var n = t.steps.length, spans = [];
      function stepIndex(obj, key, parent) {
        var path = join(parent, key), v = obj[key];
        if (typeof v !== "number" || v % 1 !== 0) { error(path, "must be an integer step index, got " + describe(v)); return false; }
        if (v < 0 || v >= n) { error(path, "step index " + v + " is out of range (" + n + " steps, valid indexes are 0–" + (n - 1) + ")"); return false; }
        return true;
      }
      t.fragments.forEach(function (f, i) {
        var fp = p + ".fragments[" + i + "]";
        if (!isObject(f)) { error(fp, "must be an object, got " + describe(f)); return; }
        if (FRAGMENT_KINDS.indexOf(f.kind) === -1) { error(fp + ".kind", "must be one of " + FRAGMENT_KINDS.join(", ") + ", got " + describe(f.kind)); return; }
        optionalString(f, "label", fp, 40, error);
        var ok = stepIndex(f, "start", fp) & stepIndex(f, "end", fp);
        if (ok && f.end < f.start) { error(fp + ".end", "must not be before start (" + f.start + ")"); ok = false; }
        if (f.kind === "alt") {
          if (f.condition !== undefined) error(fp + ".condition", "not allowed on alt; put conditions on the branches");
          if (requireArray(f, "branches", fp, 2, 4, error) && ok) {
            var expect = f.start;
            f.branches.forEach(function (b, k) {
              var bp = fp + ".branches[" + k + "]";
              if (!isObject(b)) { error(bp, "must be an object, got " + describe(b)); return; }
              requireString(b, "condition", bp, 1, 80, error);
              if (!(stepIndex(b, "start", bp) & stepIndex(b, "end", bp))) return;
              if (b.end < b.start) error(bp + ".end", "must not be before start (" + b.start + ")");
              if (b.start !== expect) error(bp + ".start", "branches must be contiguous: expected " + expect + ", got " + b.start);
              expect = b.end + 1;
              spans.push({ s: b.start, e: b.end, path: bp, branch: true, parent: i });
            });
            if (expect !== f.end + 1) error(fp + ".branches", "the last branch must end at the fragment's end (" + f.end + ")");
          }
        } else {
          if (f.branches !== undefined) error(fp + ".branches", "only allowed on alt");
          requireString(f, "condition", fp, 1, 80, error);
        }
        if (ok) spans.push({ s: f.start, e: f.end, path: fp, alt: f.kind === "alt", idx: i });
      });
      spans.forEach(function (a, i) {
        spans.forEach(function (b, j) {
          if (j <= i || a.branch || b.branch) return;
          var sep = a.e < b.s || b.e < a.s, aInB = a.s >= b.s && a.e <= b.e, bInA = b.s >= a.s && b.e <= a.e;
          if (!sep && !aInB && !bInA) error(b.path, "overlaps " + a.path + " partly; fragments are either separate or nested");
          var outer = aInB && !(a.s === b.s && a.e === b.e) ? b : (bInA ? a : null), inner = outer === b ? a : outer === a ? b : null;

          }

      });
    }

    function checkArticle(a, p) {
      if (requireArray(a, "body", p, 1, 8, error)) {

          if (typeof b !== "string") error(p + ".body[" + i + "]", "must be a string, got " + describe(b));
          else if (!b.trim()) error(p + ".body[" + i + "]", "must be a non-empty string");
          else if (b.length > 1500) error(p + ".body[" + i + "]", "must be at most 1500 characters, got " + b.length);
        });
      }
      optionalString(a, "referencesLabel", p, 24, error, 1);
      if (a.references !== undefined && requireArray(a, "references", p, 0, 10, error)) {
        a.references.forEach(function (r, i) {
          var rp = p + ".references[" + i + "]";
          if (!isObject(r)) { error(rp, "must be an object, got " + describe(r)); return; }
          requireString(r, "label", rp, 1, 60, error);
          requireUrl(r, "url", rp, error);
        });
      }
      if (a.versionNotes !== undefined && requireArray(a, "versionNotes", p, 0, 8, error)) {
        var seen = {};
        a.versionNotes.forEach(function (n, i) {
          var np = p + ".versionNotes[" + i + "]";
          if (!isObject(n)) { error(np, "must be an object, got " + describe(n)); return; }
          if (checkVersionRef(n, "version", np)) {
            if (seen[n.version]) error(np + ".version", "a second note for version " + JSON.stringify(n.version) + "; one note per version");
            seen[n.version] = true;
          }
          optionalString(n, "heading", np, 80, error, 1);
          if (requireArray(n, "items", np, 1, 8, error)) {
            n.items.forEach(function (it, j) {
              if (typeof it !== "string" || !it.trim()) error(np + ".items[" + j + "]", "must be a non-empty string, got " + describe(it));
              else if (it.length > 300) error(np + ".items[" + j + "]", "must be at most 300 characters, got " + it.length);
            });
          }
        });
      }
      if (a.boxes !== undefined && requireArray(a, "boxes", p, 0, 4, error)) {
        a.boxes.forEach(function (b, i) {
          var bp = p + ".boxes[" + i + "]";
          if (!isObject(b)) { error(bp, "must be an object, got " + describe(b)); return; }
          requireString(b, "title", bp, 1, 60, error);
          optionalEnum(b, "tone", bp, TONES, error);
          if (requireArray(b, "items", bp, 1, 8, error)) {
            b.items.forEach(function (it, j) {
              var ip = bp + ".items[" + j + "]";
              if (!isObject(it)) { error(ip, "must be an object, got " + describe(it)); return; }
              requireString(it, "text", ip, 1, 240, error);
              optionalString(it, "tag", ip, 30, error);
              if (it.url !== undefined) requireUrl(it, "url", ip, error);
            });
          }
        });
      }
    }

    function checkStepFields(st, p, touched, isOverride) {
      var count = 0;
      if (!isOverride || st.title !== undefined) requireString(st, "title", p, 1, 80, error);
      if (!isOverride || st.explanation !== undefined) requireString(st, "explanation", p, 1, 700, error);
      optionalString(st, "tag", p, 20, error);
      if (st.focus !== undefined && requireArray(st, "focus", p, 0, 12, error)) {
        st.focus.forEach(function (f, i) { if (checkEntityRef(st.focus, i, p + ".focus")) touched[f] = true; });
      }
      if (st.messages !== undefined && requireArray(st, "messages", p, 0, 20, error)) {
        st.messages.forEach(function (m, i) { checkMessage(m, p + ".messages[" + i + "]", touched); });
        count = st.messages.length;
      }
      return count;
    }

    function checkStep(st, p, touched) {
      stepCount++;

      var count = checkStepFields(st, p, touched, false);
      if (!st.messages || st.messages.length === 0) warn(p, "step has no messages; the flow table shows nothing for it");
      if (st.check !== undefined) { checkCount++; checkCheck(st.check, p + ".check"); }
      if (st.versions !== undefined) {
        var vp = p + ".versions";

    function checkMessage(m, p, touched) {

      if (okF && okT && m.from !== m.to) {
        var k = pairKey(m.from, m.to);
        if (LINKS[k] === undefined) warn(p, "no link declared between " + JSON.stringify(m.from) + " and " + JSON.stringify(m.to) + "; it is drawn dashed and unlabelled");
        else linkUsed[k] = true;
      }
      requireString(m, "name", p, 1, 60, error);
      optionalString(m, "info", p, 120, error);
      optionalEnum(m, "kind", p, MESSAGE_KINDS, error);
      optionalString(m, "size", p, 12, error);
      if (m.payload !== undefined) {
        var pp = p + ".payload", text = null;
        if (typeof m.payload === "string") text = m.payload;
        else if (m.payload !== null && typeof m.payload === "object") { try { text = JSON.stringify(m.payload, null, 2); } catch (e) { error(pp, "could not be serialised as JSON"); } }
        else error(pp, "must be a string, object or array, got " + describe(m.payload));
        if (text !== null) {
          if (text.length > MAX_PAYLOAD) error(pp, "must be at most " + MAX_PAYLOAD + " characters when serialised, got " + text.length);
          else if (text.length > WARN_PAYLOAD) warn(pp, "payload is " + text.length + " characters; over " + WARN_PAYLOAD + " it is hard to read in the panel");
        }
      }
      if (m.annotations !== undefined && requireArray(m, "annotations", p, 0, 12, error)) {
        m.annotations.forEach(function (a, i) {
          var ap = p + ".annotations[" + i + "]";
          if (!isObject(a)) { error(ap, "must be an object, got " + describe(a)); return; }
          requireString(a, "field", ap, 1, 60, error);
          requireString(a, "text", ap, 1, 300, error);
        });
      }
      if (m.tags !== undefined && requireArray(m, "tags", p, 0, 4, error)) {
        m.tags.forEach(function (t, i) {
          if (typeof t !== "string" || !t.trim()) error(p + ".tags[" + i + "]", "must be a non-empty string, got " + describe(t));
          else if (t.length > 20) error(p + ".tags[" + i + "]", "must be at most 20 characters, got " + t.length);
        });
      }
      if (m.channel !== undefined) checkChannelRef(m, "channel", p);
      if (m.holds !== undefined) {
        if (!isObject(m.holds)) error(p + ".holds", "must be an object keyed by entity id, got " + describe(m.holds));
        else Object.keys(m.holds).forEach(function (id) {
          var hp = p + ".holds." + id, ch = m.holds[id];
          if (!EI[id]) { error(hp, "entity id " + JSON.stringify(id) + " is not defined in entities"); return; }
          if (!isObject(ch)) { error(hp, "must be an object with add and/or remove, got " + describe(ch)); return; }
          Object.keys(ch).forEach(function (k) { if (k !== "add" && k !== "remove") error(hp + "." + k, "unknown field; only add and remove are allowed"); });
          if (ch.add === undefined && ch.remove === undefined) error(hp, "must have add or remove");
          if (ch.add !== undefined) checkItems(ch, "add", hp, 0, MAX_HOLDS);
          if (ch.remove !== undefined) checkItems(ch, "remove", hp, 0, MAX_HOLDS);
          if (Array.isArray(ch.add) && Array.isArray(ch.remove)) ch.add.forEach(function (item, k) { if (ch.remove.indexOf(item) !== -1) error(hp + ".add[" + k + "]", JSON.stringify(item) + " is both added and removed"); });
        });
      }
      if (m.versions !== undefined && requireArray(m, "versions", p, 1, 8, error)) {
        var seen = {};
        m.versions.forEach(function (v, i) {
          if (checkVersionRef(m.versions, i, p + ".versions")) {
            if (seen[v]) error(p + ".versions[" + i + "]", "duplicate version id " + JSON.stringify(v));
            seen[v] = true;
          }
        });
      }
    }

    function checkCheck(c, p) {
      if (!isObject(c)) { error(p, "must be an object, got " + describe(c)); return; }
      if (requireString(c, "prompt", p, 1, 300, error) && !/\?\s*$/.test(c.prompt)) warn(p + ".prompt", "does not end with a question mark");
      if (!requireArray(c, "options", p, 2, 4, error)) return;
      var correct = 0, texts = {};
      c.options.forEach(function (o, i) {
        var op = p + ".options[" + i + "]";
        if (!isObject(o)) { error(op, "must be an object, got " + describe(o)); return; }
        if (requireString(o, "text", op, 1, 200, error)) {
          var key = o.text.trim().toLowerCase();
          if (texts[key]) error(op + ".text", "duplicate option text " + JSON.stringify(o.text));
          texts[key] = true;
        }
        if (o.correct !== undefined && typeof o.correct !== "boolean") error(op + ".correct", "must be a boolean, got " + describe(o.correct));
        if (o.correct === true) correct++;
        requireString(o, "why", op, 1, 400, error);
      });
      if (correct !== 1) error(p + ".options", "exactly one option must have correct: true, got " + correct);
    }

    /* jumps */
    if (data.jumps !== undefined && requireArray(data, "jumps", "$", 0, 4, error)) {
      var seenJ = {};
      data.jumps.forEach(function (j, i) {
        var jp = "jumps[" + i + "]";
        if (typeof j !== "string") error(jp, "must be a topic id string, got " + describe(j));
        else if (!TI[j]) error(jp, "topic id " + JSON.stringify(j) + " is not defined in sections");
        else if (seenJ[j]) error(jp, "duplicate topic id " + JSON.stringify(j));
        seenJ[j] = true;
      });
    }

    /* further */
    if (data.further !== undefined) {
      var fp = "further";
      if (!isObject(data.further)) error(fp, "must be an object, got " + describe(data.further));
      else {
        optionalString(data.further, "title", fp, 60, error, 1);
        if (requireArray(data.further, "items", fp, 1, 10, error)) {
          data.further.items.forEach(function (it, i) {
            var ip = fp + ".items[" + i + "]";
            if (!isObject(it)) { error(ip, "must be an object, got " + describe(it)); return; }
            requireString(it, "title", ip, 1, 60, error);
            optionalString(it, "subtitle", ip, 80, error);
            requireUrl(it, "url", ip, error);
          });
        }
      }
    }

    /* document-wide warnings */
    if (Array.isArray(data.entities)) data.entities.forEach(function (e, i) {
      if (isObject(e) && typeof e.id === "string" && EI[e.id] && !entityUsed[e.id]) warn("entities[" + i + "]", "entity " + JSON.stringify(e.id) + " is never used by a message or focus");
    });
    if (Array.isArray(data.zones)) data.zones.forEach(function (z, i) {
      if (isObject(z) && typeof z.id === "string" && ZI[z.id] && !zoneUsed[z.id]) warn("zones[" + i + "]", "zone " + JSON.stringify(z.id) + " has no entities");
    });
    if (Array.isArray(data.links)) data.links.forEach(function (l, i) {
      if (isObject(l) && typeof l.from === "string" && typeof l.to === "string" && EI[l.from] && EI[l.to] && l.from !== l.to && !linkUsed[pairKey(l.from, l.to)]) warn("links[" + i + "]", "no message travels between " + JSON.stringify(l.from) + " and " + JSON.stringify(l.to));
    });
    if (Array.isArray(data.channels)) data.channels.forEach(function (c, i) {
      if (isObject(c) && typeof c.id === "string" && CI[c.id] && !channelUsed[c.id]) warn("channels[" + i + "]", "channel " + JSON.stringify(c.id) + " is used by no link or message");
    });
    if (hasVersions && versionRefs === 0) warn("versions", "declared but nothing references a version; the time machine changes nothing");
    if (stepCount >= 10 && checkCount === 0) warn("sections", stepCount + " steps and no check; add a prediction question or two");
  }

  // ---- shared helpers (identical in every view) --------------------------
  function describe(v) {
    if (v === null) return "null";
    if (v === undefined) return "undefined (missing)";
    if (Array.isArray(v)) return "array";
    if (typeof v === "string") return JSON.stringify(v);
    if (typeof v === "object") return "object";
    return String(v);
  }
  function join(parent, key) {
    if (typeof key === "number") return parent + "[" + key + "]";
    return parent === "$" ? key : parent + "." + key;
  }
  function requireString(obj, key, parent, min, max, error) {
    var path = join(parent, key), v = obj[key];

    /* ---------- sequence diagram ---------- */

      var H = Math.max(availH || 0, TOP + rowsTotal * ROW + 30);

        var g = svgEl("g", { class: "nthview-df-lifehead", "data-id": id }, [
          svgEl("rect", { x: f1(x - BOX / 2), y: 16, width: f1(BOX), height: 42, rx: 8 }),
          svgEl("text", { x: f1(x), y: 42, text: e.name })
        ]);
        var z = e.zone && M.Z[e.zone];
        if (z) g.appendChild(svgEl("text", { class: "nthview-df-zl", x: f1(x), y: 76, "text-anchor": "middle", text: z.name }));
        svg.appendChild(g); heads[id] = g;
      });
      var arrows = [], base = TOP;
      blocks.forEach(function (blk) {
      var Rt = blk.Rt, lastStep = -1;
      if (blk.title) {
        svg.appendChild(svgEl("line", { class: "nthview-df-ssep", x1: LEFT, y1: f1(base - 30), x2: f1(W - 10), y2: f1(base - 30) }));
        svg.appendChild(svgEl("text", { class: "nthview-df-seqtopic", x: LEFT + 4, y: f1(base - 8), text: blk.title }));

          if (i) svg.appendChild(svgEl("line", { class: "nthview-df-ssep", x1: LEFT, y1: f1(y - ROW / 2 - 2), x2: f1(W - 10), y2: f1(y - ROW / 2 - 2) }));

      anim = { g: g, raf: 0 };
      var dxTot = to.x - from.x, dyTot = to.y - from.y, len = Math.sqrt(dxTot * dxTot + dyTot * dyTot) || 1, ux = dxTot / len, uy = dyTot / len;
      function frame(ts) {
        if (!start) start = ts;
        var t = Math.min(1, (ts - start) / DUR), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        var x = from.x + dxTot * e, yy = from.y + dyTot * e;
        pill.setAttribute("transform", "translate(" + f1(x) + "," + f1(yy) + ")");
        trail.setAttribute("x2", f1(x)); trail.setAttribute("y2", f1(yy));
        var hx = x - ux * (w / 2 + 2), hy = yy - uy * (w / 2 + 2);
        head.setAttribute("points", pts([[hx, hy], [hx - ux * 10 - uy * 5, hy - uy * 10 + ux * 5], [hx - ux * 10 + uy * 5, hy - uy * 10 - ux * 5]]));
        if (t < 1) anim.raf = root.requestAnimationFrame(frame);
        else { g.classList.add("nthview-df-arrived"); anim = null; done(); }
      }
      anim.raf = root.requestAnimationFrame(frame);
    }

    /* ---------- the full picture: every entity, or every message of every topic, in one dialog ---------- */
    var fullMode = "network";
    function openFullPicture() {
      stop();
      if (ui.dialog) { if (ui.dialog.parentNode) ui.dialog.parentNode.removeChild(ui.dialog); ui.dialog = null; }
      var all = M.topics.map(function (t) { return { Rt: resolveTopic(M, data, t, state.version), title: t.title, topicId: t.id }; }).filter(function (b) { return b.Rt.avail && b.Rt.beats.length; });
      var msgs = all.reduce(function (sum, b) { return sum + b.Rt.msgCount; }, 0);
      var dlg = el("dialog", { class: "nthview-df-dialog", "aria-label": "The full picture" });
      var seg = el("div", { class: "nthview-df-seg", role: "group", "aria-label": "Diagram" });
      var body = el("div", { class: "nthview-df-dialog-body" });
      function draw() {
        body.innerHTML = "";
        seg.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-mode") === fullMode ? "true" : "false"); });
        if (fullMode === "network") {
          var net = buildNetwork(data.entities.map(function (e) { return e.id; }), body.clientWidth > 0 && body.clientWidth < 560, null);
          all.forEach(function (b) { b.Rt.beats.forEach(function (bt) { if (bt.msg) net.addEdge(bt.msg.from, bt.msg.to, null); }); });
          body.style.overflow = "hidden"; body.appendChild(net.svg);
        } else {
          var used = {};
          all.forEach(function (b) { b.Rt.entities.forEach(function (id) { used[id] = true; }); });
          var ids = data.entities.map(function (e) { return e.id; }).filter(function (id) { return used[id]; });
          var seq = buildSequence(all, ids, Math.max(320, body.clientWidth - 2), 0, { onPick: function (blk, i) {
            dlg.close(); if (blk.topicId !== state.topic) openTopic(blk.topicId, false); setPos(i);
          } });
          body.style.overflow = "auto"; body.appendChild(seq.svg);
        }
      }
      [["network", "Network"], ["sequence", "Sequence"]].forEach(function (m) {
        var b = el("button", { type: "button", "data-mode": m[0], text: m[1] });
        b.addEventListener("click", function () { fullMode = m[0]; draw(); });
        seg.appendChild(b);
      });
      var close = el("button", { type: "button", class: "nthview-df-btn", text: "Close", "aria-label": "Close the full picture" });
      close.addEventListener("click", function () { dlg.close(); });
      dlg.appendChild(el("div", { class: "nthview-df-dialog-head" }, [
        el("div", {}, [el("h2", { text: "The full picture" }), el("p", { class: "nthview-df-muted", text: data.entities.length + " entities · " + all.length + " topics · " + msgs + " messages" + (M.hasTM ? " · " + versionLabel(state.version) : "") + ". In the sequence, click a message to open it in the lesson." })]),
        seg, close
      ]));
      dlg.appendChild(body);
      dlg.addEventListener("close", function () { if (dlg.parentNode) dlg.parentNode.removeChild(dlg); ui.dialog = null; });
      container.appendChild(dlg); ui.dialog = dlg;
      if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
      draw();
    }

    /* ---------- navigation ---------- */
    function setScreen(s) {
      stop(); state.screen = s; persist(); renderAll();
    }
    function openTopic(id, fromHero) {
      stop(); state.topic = id; state.screen = "lesson"; state.pos = 0; persist(); renderAll();
      if (!ui.stage) return;
      if (!fromHero && root.innerWidth < 1024) ui.stage.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
      try { ui.stage.focus({ preventScroll: true }); } catch (e) { ui.stage.focus(); }
    }
    function setVersion(id) {
      if (id === state.version) return;
      stop(); state.version = id; persist(); renderAll();
      var pressed = container.querySelector(".nthview-df-tml [aria-pressed=true]");
      if (pressed && root.innerWidth >= 1024) pressed.focus();
    }
    function renderAll() {
      cancelAnim();
      resolve();
      var sideScroll = ui.side ? ui.side.scrollTop : 0;
      container.innerHTML = "";
      ui = {};
      container.appendChild(topBar());
      if (state.screen === "intro") { container.appendChild(hero()); drawPreview(); }
      else { container.appendChild(lesson()); buildStage(); refresh(); if (ui.side) ui.side.scrollTop = sideScroll; }
    }

    /* ---------- keyboard and resize ---------- */
    container.addEventListener("keydown", function (e) {
      var tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "select" || tag === "textarea") return;
      if (e.key === "Escape" && ui.side && ui.side.classList.contains("nthview-df-open")) { toggleDrawer(false); return; }
      if (e.key === "Escape" && ui.quiz && ui.quiz.classList.contains("nthview-df-open") && ui.quizStep !== undefined && state.checks[checkKey(ui.quizStep)] !== undefined) { closeQuiz(); return; }
      if (state.screen !== "lesson") return;
      if (e.key === " " && tag !== "button" && tag !== "a" && tag !== "tr") { e.preventDefault(); if (playing) stop(); else play(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); stop(); stepForward(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); stop(); if (state.pos > 0) setPos(state.pos - 1); }
    });
    var resizeTimer = null;
    function onResize() {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        if (state.screen === "intro") { drawPreview(); return; }
        if (!ui.stage || playing) return;
        var narrow = ui.stage.clientWidth > 0 && ui.stage.clientWidth < 560;
        if (narrow !== narrowStage || state.mode === "sequence") { buildStage(); refresh(); }
      }, 120);
    }
    root.addEventListener("resize", onResize);
    if (root.ResizeObserver) { var ro = new root.ResizeObserver(onResize); ro.observe(container); }
    doc.addEventListener("visibilitychange", function () { if (doc.hidden) { stop(); persist(); } });
    root.addEventListener("pagehide", function () { persist(); });

    renderAll();
  }

  NthView.build = function (container, data) {
    if (!container || typeof container.appendChild !== "function") {
      throw new TypeError("NthView.build: container must be a DOM element");
    }
    container.innerHTML = "";
    container.classList.add("nthview", "nthview-dataflow");
    injectStyles();

    if (typeof NthView.validate !== "function") {
      renderErrorPanel(container, { errors: [{ path: "$", message: "validate.js must be inlined before view.js" }] });
      return { valid: false, errors: [], warnings: [] };
    }
    var result = NthView.validate(data);
    if (!result.valid) {
      renderErrorPanel(container, result);
      return result;
    }
    render(container, data);
    return result;
  };
  NthView.THEMES = THEMES;
})(typeof globalThis !== "undefined" ? globalThis : window);
  </script>
  <script>
    (function () {
      var data = JSON.parse(document.getElementById("nthview-data").textContent);
      NthView.build(document.getElementById("app"), data);
    })();
  </script>
</body>
