    }
  ],
  "links": [

  ],
  "steps": [
    {
      "title": "Weeks earlier: a certificate authority vouches for the server's key",
      "explanation": "The server generated its own key pair and kept the private half. The CA signs a statement binding the public half to the name example.com. Without that signature, a browser could not tell the real server from anyone who answers on the network.",
      "messages": [
        {
          "from": "ca",
          "to": "server",
          "name": "signed certificate",
          "kind": "transport",
          "channel": "offline",
          "payload": "Certificate (X.509 v3)\n  subject          CN=example.com\n  subjectAltName   DNS:example.com, DNS:www.example.com\n  public key       ECDSA P-256 (the server's own key pair)\n  validity         90 days\n  issuer           Example Issuing CA\n  signature        made with the CA's private key\n\n→ issued after the server proved it controls example.com\n  (for example with the ACME protocol)",
          "holds": {
            "server": {
              "add": [
                "certificate chain"
              ]
            }
          }
        }
      ],
      "detail": [
        {
          "label": "Who's involved",
          "text": "The certificate authority and the server operator. No browser is involved yet."
        },
        {
          "label": "What's in play",
          "text": "A leaf certificate for example.com and an intermediate certificate for the issuing CA, which chains up to a root certificate that browsers ship with."
        },
        {
          "label": "Which spec",
          "text": "X.509 certificates and path validation, RFC 5280. Automated issuance, RFC 8555 (ACME)."
        }
      ]
    },
    {
      "title": "The browser makes a one-time key pair",
      "explanation": "TLS 1.3 agrees on keys with ((ECDHE)): each side makes a throwaway key pair and sends only the public half. Making the pair now lets the browser put its public key in the very first message.",
      "messages": [
        {
          "from": "browser",
          "to": "browser",
          "name": "fresh key pair",
          "kind": "local",
          "channel": "local",
          "payload": "client_random      = 32 random bytes\nephemeral private  = 32 random bytes            (x25519)\nephemeral public   = X25519(private, base point)\n\n→ a brand-new pair for this connection only",
          "holds": {
            "browser": {
              "add": [
                "ephemeral private key",
                "client random"
              ]
            }
          }
        }
      ],
      "detail": [
        {
          "label": "Who's involved",
          "text": "The browser alone."
        },
        {
          "label": "Worth knowing",
          "text": "Browsers often prepare shares for one or two likely groups (x25519 is the usual first guess) and may also offer a post-quantum hybrid group; which groups are offered varies by browser and version."
        }
      ]
    },
    {
      "title": "ClientHello: the browser proposes, and already sends its key share",
      "explanation": "The real version lives in `supported_versions`; the old version field is frozen at TLS 1.2 so that equipment which never heard of 1.3 lets the packet through. The key share is a guess at the group the server will pick. When the guess is right, keys exist after a single reply.",
      "messages": [
        {
          "from": "browser",
          "to": "server",
          "name": "ClientHello + key share",
          "kind": "request",
          "channel": "clear",
          "payload": "Handshake: ClientHello\n  legacy_version     0x0303          (\"TLS 1.2\", for old middleboxes)\n  random             32 random bytes\n  legacy_session_id  32 bytes        (compatibility mode)\n  cipher_suites      TLS_AES_128_GCM_SHA256\n                     TLS_AES_256_GCM_SHA384\n                     TLS_CHACHA20_POLY1305_SHA256\n  extensions\n    server_name           example.com\n    supported_versions    TLS 1.3 (0x0304), TLS 1.2\n    supported_groups      x25519, secp256r1\n    key_share             x25519: 32-byte public key\n    signature_algorithms  ecdsa_secp256r1_sha256, rsa_pss_rsae_sha256, …\n    application_layer_protocol_negotiation  h2, http/1.1",
          "holds": {
            "server": {
              "add": [
                "browser's key share",
                "client random"
              ]
            }
          }
        }
      ],
      "compare": {
        "label": "In TLS 1.2",
        "text": "The ClientHello only proposed. The key exchange came one round trip later, so a full handshake needed two round trips before the first byte of the page could be sent."
      },
      "detail": [
        {
          "label": "Who can read it",
          "text": "Everyone on the path, including the name in ((server_name|SNI)) and the protocols in ((ALPN))."
        },
        {
          "label": "Which spec",
          "text": "RFC 8446 §4.1.2 (ClientHello) and §4.2 (extensions). Middlebox compatibility mode, Appendix D.4."
        }
      ],
      "check": {
        "prompt": "Why does the browser send a key share before it knows which groups the server supports?",
        "options": [
          {
            "text": "To save a round trip: if the guess is right, both sides have keys after one reply",
            "correct": true,
            "why": "That is the design. A wrong guess costs one extra round trip (a HelloRetryRequest); a right one makes the handshake 1-RTT."
          },
          {
            "text": "Because the key share encrypts the ClientHello",
            "why": "The ClientHello travels in the clear. Hiding it needs a separate extension, Encrypted Client Hello, which uses a key published in DNS."
          },
          {
            "text": "So that the server can check who the browser is",
            "why": "An ephemeral public key says nothing about identity; it was made seconds ago. Client authentication, when used, is a separate certificate."
          },
          {
            "text": "Because the server must accept the first share it gets",
            "why": "It need not. A server that supports none of the offered groups answers with a HelloRetryRequest naming the group it wants."
          }
        ]
      }
    },
    {
      "title": "Only if the guess was wrong: the server asks for another group",
      "explanation": "A server that supports none of the offered groups does not fail; it names the one it wants. This costs one extra round trip and is why browsers guess the most common group first.",
      "messages": [
        {
          "from": "server",
          "to": "browser",
          "name": "HelloRetryRequest",
          "kind": "response",
          "channel": "clear",
          "payload": "Handshake: ServerHello   (acting as HelloRetryRequest)\n  random        SHA-256(\"HelloRetryRequest\")   — a fixed, recognisable value\n  cipher_suite  TLS_AES_128_GCM_SHA256\n  extensions\n    supported_versions  TLS 1.3\n    key_share           selected_group: secp256r1\n    cookie              (optional)"
        }
      ],
      "detail": [
        {
          "label": "Worth knowing",
          "text": "The transcript replaces the first ClientHello with a hash of it, so both sides still agree on exactly what was said. The holds strip skips this detour: had it happened, the browser would swap its key share and carry on."
        },
        {
          "label": "Which spec",
          "text": "RFC 8446 §4.1.4."
        }
      ]
    },
    {
      "title": "Only if asked: the browser retries with the requested group",
      "explanation": "Everything else stays identical, so an attacker cannot use the retry to quietly downgrade the other choices.",
      "messages": [
        {
          "from": "browser",
          "to": "server",
          "name": "ClientHello again",
          "kind": "request",
          "channel": "clear",
          "payload": "Handshake: ClientHello   (second attempt)\n  … the same fields as before, except\n    key_share   secp256r1: 65-byte public key\n    cookie      echoed back, if the server sent one"
        }
      ],
      "detail": [
        {
          "label": "Which spec",
          "text": "RFC 8446 §4.1.2, the rules for the second ClientHello."
        }
      ]
    },
    {
      "title": "ServerHello: the server picks, and sends its own key share",
      "explanation": "With both public keys on the wire, each side can now compute the same shared secret, which nobody watching can. From the next message on, everything the server sends is encrypted.",
      "messages": [
        {
          "from": "server",
          "to": "browser",
          "name": "ServerHello + key share",
          "kind": "response",
          "channel": "clear",
          "payload": "Handshake: ServerHello\n  legacy_version   0x0303\n  random           32 random bytes\n  cipher_suite     TLS_AES_128_GCM_SHA256\n  extensions\n    supported_versions  TLS 1.3 (0x0304)\n    key_share           x25519: the server's 32-byte public key\n\n→ the server already computes the shared secret and its handshake keys",
          "holds": {
            "server": {
              "add": [
                "handshake traffic keys"
              ]
            },
            "browser": {
              "add": [
                "server's key share",
                "server random"
              ]
            }
          }
        }
      ],
      "compare": {
        "label": "In TLS 1.2",
        "text": "RSA key transport was still allowed: the browser encrypted the secret with the server's long-term RSA key. Whoever later steals that key can decrypt every recorded session. TLS 1.3 removed it and offers only ((ECDHE)) and ((PSK)) modes."
      },
      "detail": [
        {
          "label": "Who's involved",
          "text": "The server, answering in the clear."
        },
        {
          "label": "What's in play",
          "text": "The chosen cipher suite names the ((AEAD)) and the hash for ((HKDF)); the certificate's signature algorithm is negotiated separately."
        },
        {
          "label": "Which spec",
          "text": "RFC 8446 §4.1.3."
        }
      ],
      "check": {
        "type": "who",
        "answer": "server",
        "why": "The browser has made its offer; it is the server's turn to choose a cipher suite and answer with its own key share."
      }
    },
    {
      "title": "The key schedule turns the shared secret into handshake keys",
      "explanation": "Every key is derived from the shared secret and a hash of the messages so far, the ((transcript hash)). Erasing the ephemeral private key is what gives ((forward secrecy)): a later theft of the server's certificate key cannot recover this session. Open the inner sequence to follow the derivation stage by stage.",
      "messages": [
        {
          "from": "browser",
          "to": "key-schedule",
          "name": "shared secret + hash",
          "kind": "request",
          "channel": "local",
          "payload": "shared  = X25519(browser private key, server public key)\nearly   = HKDF-Extract(0, 0)                  (no PSK this time)\nhs      = HKDF-Extract(Derive-Secret(early, \"derived\", \"\"), shared)\nc_hs    = Derive-Secret(hs, \"c hs traffic\", ClientHello…ServerHello)\ns_hs    = Derive-Secret(hs, \"s hs traffic\", ClientHello…ServerHello)\n\n→ the ephemeral private key is no longer needed and can be erased",
          "holds": {
            "browser": {
              "remove": [
                "ephemeral private key"
              ],
              "add": [
                "handshake traffic keys"
              ]
            }
          }
        }
      ],
      "note": {
        "severity": "info",
        "text": "Two different keys come out: one for each direction. Each side encrypts with its own and decrypts with the other's."
      },
      "detail": [
        {
          "label": "Which spec",
          "text": "RFC 8446 §7.1, the key schedule."
        }
      ],
      "inner": {
        "subtitle": "The key schedule is a chain of ((HKDF)) stages. Each stage extracts a secret from the one before and mixes in something new.",
        "steps": [
          {
            "title": "Stage 1: the early secret, from a PSK or from zeros",
            "explanation": "On a resumed connection a pre-shared key from an earlier session goes in here. On a first visit the stage still runs, on zeros, so the schedule has one shape for every handshake.",
            "messages": [
              {
                "from": "browser",
                "to": "early-secret",
                "name": "no PSK: zeros",
                "kind": "request",
                "channel": "local",
                "payload": "early = HKDF-Extract(salt = 0, IKM = PSK or 32 zero bytes)\n\n(no session ticket this time, so the input is zeros)"
              }
            ]
          },
          {
            "title": "The early secret becomes the salt for the next stage",
            "explanation": "Each stage hands the next one a salt derived from itself, never itself. A leak of a later secret does not run backwards to an earlier one.",
            "messages": [
              {
                "from": "early-secret",
                "to": "handshake-secret",
                "name": "\"derived\" salt",
                "kind": "request",
                "channel": "local",
                "payload": "salt = Derive-Secret(early, \"derived\", \"\")"
              }
            ]
          },
          {
            "title": "Stage 2: the shared secret is mixed in",
            "explanation": "This is the only place the ((ECDHE)) result enters. Once `hs` exists the browser no longer needs its private key, and throwing it away is what makes the session's keys unrecoverable later.",
            "messages": [
              {
                "from": "browser",
                "to": "handshake-secret",
                "name": "ECDHE shared secret",
                "kind": "request",
                "channel": "local",
                "payload": "shared = X25519(browser private key, server public key)\nhs     = HKDF-Extract(salt, shared)\n\n→ the ephemeral private key can now be erased",
                "holds": {
                  "browser": {
                    "remove": [
                      "ephemeral private key"
                    ]
                  }
                }
              }
            ]
          },
          {
            "title": "Two handshake traffic secrets, one per direction",
            "explanation": "The labels differ, so the two directions get unrelated keys. The ((transcript hash)) binds them to exactly these hello messages: a tampered hello yields different keys and the handshake fails.",
            "messages": [
              {
                "from": "handshake-secret",
                "to": "traffic-secrets",
                "name": "transcript hash",
                "kind": "request",
                "channel": "local",
                "payload": "c_hs = Derive-Secret(hs, \"c hs traffic\", ClientHello…ServerHello)\ns_hs = Derive-Secret(hs, \"s hs traffic\", ClientHello…ServerHello)"
              }
            ],
            "check": {
              "prompt": "Why does each direction get its own traffic secret?",
              "options": [
                {
                  "text": "So a message cannot be reflected back to its sender as if the other side wrote it",
                  "correct": true,
                  "why": "With one shared key, an attacker could bounce a record back to the side that sent it. Separate keys make that impossible."
                },
                {
                  "text": "To make the handshake faster",
                  "why": "Deriving two secrets costs slightly more, not less. The reason is security."
                },
                {
                  "text": "Because the server and the browser use different ciphers",
                  "why": "Both directions use the cipher suite agreed in ServerHello."
                }
              ]
            }
          },
          {
            "title": "Stage 3 is prepared for later: the master secret",
            "explanation": "The master secret takes no new input. It waits until the transcript covers the whole handshake, then yields the application traffic keys.",
            "messages": [
              {
                "from": "handshake-secret",
                "to": "master-secret",
                "name": "\"derived\" salt",
                "kind": "request",
                "channel": "local",
                "payload": "master = HKDF-Extract(Derive-Secret(hs, \"derived\", \"\"), 0)\n\n→ used after the server's Finished, for the application keys"
              }
            ]
          },
          {
            "title": "Keys and IVs leave the schedule",
            "explanation": "A traffic secret is not used directly: each one is expanded into the ((AEAD)) key and IV for its direction.",
            "messages": [
              {
                "from": "traffic-secrets",
                "to": "browser",
                "name": "handshake keys",
                "kind": "response",
                "channel": "local",
                "payload": "key = HKDF-Expand-Label(secret, \"key\", \"\", key length)\niv  = HKDF-Expand-Label(secret, \"iv\",  \"\", 12)\n\n← client and server handshake keys and IVs",
                "holds": {
                  "browser": {
                    "add": [
                      "handshake traffic keys"
                    ]
                  }
                }
              }
            ]
          }
        ]
      }
    },
    {
      "title": "EncryptedExtensions: the rest of the server's answers, now hidden",
      "explanation": "Anything not needed to agree on keys moves behind encryption. An observer can no longer see which application protocol was chosen.",
      "messages": [
        {
          "from": "server",
          "to": "browser",
          "name": "EncryptedExtensions",
          "kind": "response",
          "channel": "hs",
          "payload": "record: application_data   (outer type 23; the real type is inside the encryption)\nHandshake: EncryptedExtensions\n  application_layer_protocol_negotiation  h2\n  server_name                             (empty: acknowledged)"
        }
      ],
      "compare": {
        "label": "In TLS 1.2",
        "text": "All server extensions travelled in the clear inside the ServerHello."
      },
      "detail": [
        {
          "label": "Worth knowing",
          "text": "Every encrypted record carries the outer type application_data, so an observer cannot even tell handshake messages from page data by their headers."
        },
        {
          "label": "Which spec",
          "text": "RFC 8446 §4.3.1, and §5.2 for the record format."
        }
      ]
    },
    {
      "title": "Certificate: the server presents its chain",
      "explanation": "The chain is the CA's statement from the first step. It proves nothing yet: anyone can replay a public certificate. The next message proves the server holds the matching private key.",
      "messages": [
        {
          "from": "server",
          "to": "browser",
          "name": "Certificate",
          "kind": "response",
          "channel": "hs",
          "payload": "Handshake: Certificate\n  certificate_request_context  (empty)\n  certificate_list\n    [0] example.com          issued by Example Issuing CA\n        extensions: OCSP status, SCTs   (optional)\n    [1] Example Issuing CA   issued by Example Root CA\n\n→ the root itself is not sent; the browser must already have it",
          "holds": {
            "browser": {
              "add": [
                "server certificate chain"
              ]
            }
          }
        }
      ],
      "compare": {
        "label": "In TLS 1.2",
        "text": "The certificate was sent in the clear, so anyone on the path could see exactly which site's certificate you received. The site name can still leak through ((SNI)) unless Encrypted Client Hello is used."
      },
      "detail": [
        {
          "label": "What's in play",
          "text": "The leaf certificate and any intermediates, in order. An OCSP response stapled here saves the browser a separate revocation check."
        },
        {
          "label": "Which spec",
          "text": "RFC 8446 §4.4.2."
        }
      ]
    },
    {
      "title": "CertificateVerify: the server signs the conversation so far",
      "explanation": "Only the holder of the certificate's private key can make this signature, and it covers this exact handshake, including both fresh key shares. A replayed certificate without the key fails here.",
      "messages": [
        {
          "from": "server",
          "to": "browser",
          "name": "CertificateVerify",
          "kind": "response",
          "channel": "hs",
          "payload": "Handshake: CertificateVerify\n  algorithm  ecdsa_secp256r1_sha256\n  signature  Sign(server private key,\n                  64 × 0x20 ‖ \"TLS 1.3, server CertificateVerify\" ‖ 0x00\n                  ‖ Transcript-Hash(ClientHello … Certificate))"
        }
      ],
      "note": {
        "severity": "info",
        "text": "The fixed prefix of 64 spaces and a context string keeps this signature from ever being mistaken for a signature made in another protocol or role."
      },
      "detail": [
        {

      var trail = svgEl("line", { class: "nthview-df-trail", x1: f1(from.x), y1: f1(from.y), x2: f1(from.y === to.y && from.x === to.x ? from.x : from.x), y2: f1(from.y) });

      var pill = svgEl("g", { transform: "translate(" + f1(from.x) + "," + f1(from.y) + ")" }, [
        svgEl("rect", { class: "nthview-df-pb", x: f1(-w / 2), y: -15, width: f1(w), height: 30, rx: 15 }),
        svgEl("circle", { class: "nthview-df-pd", cx: f1(-w / 2 + 15), cy: 0, r: 4.5 }),
        svgEl("text", { class: "nthview-df-pt", x: f1(-w / 2 + 27), y: 4.5, text: label })

      if (isDeprecated(m)) pill.appendChild(svgEl("text", { class: "nthview-df-pdep", x: 0, y: -22, "text-anchor": "middle", text: "DEPRECATED" }));

      fx.appendChild(g);

      var dxTot = to.x - from.x, dyTot = to.y - from.y, len = Math.sqrt(dxTot * dxTot + dyTot * dyTot) || 1, ux = dxTot / len, uy = dyTot / len;

        trail.setAttribute("x2", f1(x)); trail.setAttribute("y2", f1(yy));

    /* ---------- the full picture: every entity, or every message of every topic, in one dialog ---------- */
    var fullMode = "network";
    function openFullPicture() {
      stop();
      if (ui.dialog) { if (ui.dialog.parentNode) ui.dialog.parentNode.removeChild(ui.dialog); ui.dialog = null; }
      var expand = false, zoom = 1, all, msgs;
      function blocks() {
        all = M.topics.map(function (t) {
          var Rt = resolveTopic(M, data, t, state.version, [], isOpen);
          return { Rt: expand && Rt.avail ? flatten(M, data, Rt, state.version, []) : Rt, title: M.single ? null : t.title, topicId: t.id };
        }).filter(function (b) { return b.Rt.avail && b.Rt.beats.length; });
        msgs = all.reduce(function (sum, b) { return sum + b.Rt.msgCount; }, 0);
      }
      blocks();
      var tools = el("div", { class: "nthview-df-zoom" }), xb = el("button", { type: "button", class: "nthview-df-btn", text: "Expand all", "aria-pressed": "false", title: "Draw every inner sequence in place and open every group" });
      xb.addEventListener("click", function () { expand = !expand; xb.setAttribute("aria-pressed", expand ? "true" : "false"); blocks(); draw(); });
      tools.appendChild(xb);
      [["−", 1 / 1.25, "Zoom out"], ["+", 1.25, "Zoom in"], ["Fit", 0, "Fit the width"]].forEach(function (z) {
        var b = el("button", { type: "button", class: "nthview-df-btn", text: z[0], "aria-label": z[2] });
        b.addEventListener("click", function () { zoom = z[1] ? Math.max(0.4, Math.min(3, zoom * z[1])) : 1; draw(); });
        tools.appendChild(b);
      });
      var dlg = el("dialog", { class: "nthview-df-dialog", "aria-label": "The full picture" });
      var seg = el("div", { class: "nthview-df-seg", role: "group", "aria-label": "Diagram" });
      var body = el("div", { class: "nthview-df-dialog-body" });
      function draw() {
        body.innerHTML = "";
        count.textContent = data.entities.length + " entities · " + (M.single ? "" : all.length + " topics · ") + msgs + " messages" + (M.hasTM ? " · " + versionLabel(state.version) : "") + ". In the sequence, click a message to open it in the lesson.";
        tools.style.display = fullMode === "sequence" ? "" : "none";
        seg.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-mode") === fullMode ? "true" : "false"); });
        if (fullMode === "network") {
          var net = buildNetwork(data.entities.map(function (e) { return e.id; }), body.clientWidth > 0 && body.clientWidth < 560, null);
          all.forEach(function (b) { b.Rt.beats.forEach(function (bt) { if (bt.msg) net.addEdge(bt.msg.from, bt.msg.to, null); }); });
          body.style.overflow = "hidden"; body.appendChild(net.svg);
        } else {
          var used = {};
          all.forEach(function (b) { b.Rt.entities.forEach(function (id) { used[id] = true; }); });
          var ids = data.entities.map(function (e) { return e.id; }).filter(function (id) { return used[id]; });
          var seq = buildSequence(all, ids, Math.max(320, body.clientWidth - 2), 0, { refs: !expand, onPick: function (blk, i) { dlg.close(); goTo(blk.topicId, blk.Rt.beats[i]); },
            onRef: function () { expand = true; xb.setAttribute("aria-pressed", "true"); blocks(); draw(); } });
          var vb = seq.svg.getAttribute("viewBox").split(" ");
          seq.svg.style.width = f1(vb[2] * zoom) + "px"; seq.svg.style.height = f1(vb[3] * zoom) + "px";
          body.style.overflow = "auto"; body.appendChild(seq.svg);
        }
      }
      [["network", "Network"], ["sequence", "Sequence"]].forEach(function (m) {
        var b = el("button", { type: "button", "data-mode": m[0], text: m[1] });
        b.addEventListener("click", function () { fullMode = m[0]; draw(); });
        seg.appendChild(b);
      });
      var close = el("button", { type: "button", class: "nthview-df-btn", text: "Close", "aria-label": "Close the full picture" });
      close.addEventListener("click", function () { dlg.close(); });
      var count = el("p", { class: "nthview-df-muted" });
      dlg.appendChild(el("div", { class: "nthview-df-dialog-head" }, [
        el("div", {}, [el("h2", { text: "The full picture" }), count]),
        seg, tools, close
      ]));
      dlg.appendChild(body);
      dlg.addEventListener("close", function () { if (dlg.parentNode) dlg.parentNode.removeChild(dlg); ui.dialog = null; });
      container.appendChild(dlg); ui.dialog = dlg;
      if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");

    }

    /* ---------- navigation ---------- */
    function setScreen(s) {
      stop(); state.screen = s; persist(); renderAll();
    }
    /* open a beat picked on the full picture: its topic, its level, and the beat that shows it */
    function goTo(tid, b) {

        var x = R.beats[k];
        if (b.msg ? x.msg === b.msg || (x.grp && x.msgs.indexOf(b.msg) !== -1) : (x.grp ? target >= x.grp.start && target <= x.grp.end : x.step === target)) at = k;
      }
      state.pos = at; persist(); renderAll(); focusStage();
    }
    function openTopic(id, fromHero) {
      stop(); state.topic = id; state.screen = "lesson"; state.path = []; state.pos = 0; persist(); renderAll();
      if (!ui.stage) return;
      if (!fromHero && root.innerWidth < 1024) ui.stage.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
      try { ui.stage.focus({ preventScroll: true }); } catch (e) { ui.stage.focus(); }
    }

      container.innerHTML = "";
      ui = {};
      container.appendChild(topBar());
      if (state.screen === "intro" && !M.single) { container.appendChild(hero()); drawPreview(); }
      else { container.appendChild(lesson()); buildStage(); refresh(); if (ui.side) ui.side.scrollTop = sideScroll; }
    }

    /* ---------- keyboard and resize ---------- */
    container.addEventListener("click", function (e) { if (live() && ui.pop && !ui.pop.contains(e.target)) hideTerm(); });
    container.addEventListener("keydown", function (e) {
      if (!live()) return;
      if (e.key === "Escape" && ui.pop) { hideTerm(); return; }
      var tag = (e.target.tagName || "").toLowerCase();

      if (e.key === "Escape" && ui.quiz && ui.quiz.classList.contains("nthview-df-open") && ui.quizStep !== undefined && state.checks[checkKey(ui.quizStep)] !== undefined) { closeQuiz(); return; }
      if (state.screen !== "lesson") return;

      else if (e.key === "ArrowRight") { e.preventDefault(); stop(); stepForward(); }

        if (!ui.stage || playing) return;
        var narrow = ui.stage.clientWidth > 0 && ui.stage.clientWidth < 560;

  }

  </script>
