    },
    {
      "id": "guru",
      "situation": "Ravi asks: \"Do I need a teacher to make real progress?\"",
      "prompt": "How would Osho answer?",
      "options": [
        {
          "text": "No teacher can help you; be a light to yourself and accept no authority, including mine.",
          "trap": true,
          "tempting": "Both teachers attacked religious authority, so this can sound like either.",
          "why": "That is Krishnamurti's position. Osho, by contrast, initiated disciples and taught that the bond with a living master can help."

        {

        {
          "text": "Osho dismissed Krishnamurti as a fraud.",
          "trap": true,
          "tempting": "Osho did mock many religious figures, often sharply.",
          "why": "Not Krishnamurti. His criticism was about method, not sincerity; he praised Krishnamurti as right in what he said."

          "text": "Osho said Krishnamurti was his own master.",
          "tempting": "Osho clearly respected him, and reportedly encouraged followers to attend his talks.",
          "why": "He admired him but never claimed him as his teacher; Osho said he became enlightened himself in 1953."

          "text": "They wrote a book of dialogues together.",
          "tempting": "Krishnamurti did hold famous book-length dialogues with someone.",
          "why": "Those were with the physicist David Bohm, not with Osho."
        }
      ],
      "takeaway": "Osho admired Krishnamurti's insight but thought people needed methods first; that is the whole difference in one sentence."

  "summary": {
    "heading": "What you've learned",
    "closing": [
      "Krishnamurti and Osho agree that inherited belief and authority stand in the way, that awareness without judgement matters most, and that freedom has to be discovered by each person. Many of their sentences could be swapped without anyone noticing.",
      "They disagree about nearly everything practical. Krishnamurti: no method, no guru, no followers, no time; just seeing, now. Osho: a master, a movement and many methods, beginning with the body and its tensions, in a life that celebrates the world. Osho put it himself: Krishnamurti's teachings had all the seeds, but he never prepared the ground."
    ]
  }
