        var d = el("button", { type: "button", role: "tab", "aria-label": "Card " + (k + 1) + ": " + x.headline, class: state.read[x.id] ? "nthview-hl-read" : "", tabindex: k === state.i ? "0" : "-1" });

        d.addEventListener("click", function () { go(k); });
        return d;
      }));
      var actions = [prevBtn, dots, nextBtn];
      if (c.href && kindOf(c) !== "cta" && !c.cta) actions.push(el("a", { class: "nthview-hl-open", href: c.href, text: "Open" }, [icon("arrow")]));
      stage.appendChild(el("div", { class: "nthview-hl-actions" }, actions));

      /* caption, like a post caption */
      var cap = el("div", { class: "nthview-hl-caption" });
      if (data.subtitle) cap.appendChild(el("p", {}, [el("b", { text: data.title + " " }), root.document.createTextNode(data.subtitle)]));
      if (data.tags && data.tags.length) cap.appendChild(el("ul", { class: "nthview-hl-tags", "aria-label": "Tags" }, data.tags.map(function (t) { return el("li", { text: "#" + t }); })));
      stage.appendChild(cap);
      stage.appendChild(el("p", { class: "nthview-hl-hint", text: "Tap the sides or use ← → to move. " + Object.keys(state.read).length + " of " + n + " read." }));
      live.textContent = "Card " + (state.i + 1) + " of " + n + ": " + c.headline;
      persist();
    }

    function renderGrid() {
      stage.innerHTML = "";
      var readCount = cards.filter(function (x) { return state.read[x.id]; }).length;
      stage.appendChild(el("div", { class: "nthview-hl-gridhead" }, [el("span", { text: n + " cards" }), el("span", { text: readCount + " read" })]));
      stage.appendChild(el("ul", { class: "nthview-hl-grid" }, cards.map(function (c, k) {
        var tile = el("button", { type: "button", class: "nthview-hl-tile" + (state.read[c.id] ? " nthview-hl-read" : ""), "aria-label": "Card " + (k + 1) + ": " + c.headline });
        setAccent(tile, accentOf(c, k));
        shapes(k).slice(0, 1).forEach(function (s) { tile.appendChild(s); });
        tile.appendChild(el("small", { text: c.kicker || kindOf(c) }));
        tile.appendChild(el("b", { text: kindOf(c) === "quote" ? c.quote.text : kindOf(c) === "number" ? c.number.value + " " + c.number.label : c.headline }));
        tile.appendChild(el("em", { text: String(k + 1) }));
        tile.addEventListener("click", function () { setMode("story"); go(k); });
        return el("li", {}, [tile]);
      })));
      persist();
    }

    function go(k) {
      if (k < 0 || k >= n) return;
      dir = k >= state.i ? 12 : -12;
      state.i = k;
      if (state.mode !== "story") setMode("story"); else renderStory();
      var f = stage.querySelector(".nthview-hl-frame"); if (f) f.focus && f.setAttribute("tabindex", "-1");
    }
    function setMode(m) {
      state.mode = m;
      storyBtn.setAttribute("aria-pressed", String(m === "story"));
      gridBtn.setAttribute("aria-pressed", String(m === "grid"));
      if (m === "grid") renderGrid(); else renderStory();
    }
    storyBtn.addEventListener("click", function () { setMode("story"); });
    gridBtn.addEventListener("click", function () { setMode("grid"); });

    function onKey(e) {
      if (!root.document.body.contains(container)) { root.document.removeEventListener("keydown", onKey); return; }
      var t = e.target, tag = t && t.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || (t && t.isContentEditable)) return;
      if (state.mode !== "story") return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); go(state.i + 1); }
      else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); go(state.i - 1); }
      else if (e.key === "Home") { e.preventDefault(); go(0); }
      else if (e.key === "End") { e.preventDefault(); go(n - 1); }
    }
    root.document.addEventListener("keydown", onKey);

    setMode(state.mode);

    if (resumed) {
      var note = el("div", { class: "nthview-resume", role: "status", text: "Welcome back, continuing from card " + (state.i + 1) + " of " + n + "." });
      shell.appendChild(note);
      var gone = false;
      function hide() { if (gone) return; gone = true; note.style.opacity = "0"; setTimeout(function () { if (note.parentNode) note.parentNode.removeChild(note); }, 600); root.document.removeEventListener("pointerdown", hide); root.document.removeEventListener("keydown", hide); }
      setTimeout(hide, 6000);
      root.document.addEventListener("pointerdown", hide); root.document.addEventListener("keydown", hide);
    }
  }

  NthView.build = function (container, data) {
    if (!container || typeof container.appendChild !== "function") {
      throw new TypeError("NthView.build: container must be a DOM element");
    }
    container.innerHTML = "";
    container.classList.add("nthview", "nthview-highlights");
    injectStyles();

    if (typeof NthView.validate !== "function") {
      renderErrorPanel(container, { errors: [{ path: "$", message: "validate.js must be inlined before view.js" }] });
      return { valid: false, errors: [], warnings: [] };
    }
    var result = NthView.validate(data);
    if (!result.valid) {
      renderErrorPanel(container, result);
      return result;
    }
    render(container, data);
    return result;
  };

  NthView.libs = [
    { kind: "style", href: "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600;700;800&display=swap",
      name: "Google Fonts" }
  ];
})(typeof globalThis !== "undefined" ? globalThis : window);
  </script>
  <script>
    (function () {
      var data = JSON.parse(document.getElementById("nthview-data").textContent);
      NthView.build(document.getElementById("app"), data);
    })();
  </script>
</body>
</html>
