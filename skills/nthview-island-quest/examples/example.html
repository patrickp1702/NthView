      if (Array.isArray(sv.coinsGot)) sv.coinsGot.forEach(function (ci) { if (isIdx(ci, coinPickups.length) && !coinPickups[ci].got) { coinPickups[ci].got = true; scene.remove(coinPickups[ci].mesh); } });
