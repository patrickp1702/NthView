  "wrap": {
    "heading": "What WannaCry shows",
    "text": [
      "WannaCry was not a story about an unknown flaw. The fix came out a month before the exploit was leaked and two months before the outbreak; the warning reached the NHS within days. What failed was the long middle: turning a published patch into installed patches on every machine.",
      "Read the timeline again through its causes: a leak and an unpatched estate were the conditions, the worm's release was the trigger, and a researcher's routine curiosity was the turning point that stopped it."
    ],
    "takeaways": [
      "A patch protects only the machines it is installed on.",
      "A leaked exploit can be turned into a weapon within weeks.",
      "A worm needs no clicks; one unpatched machine can infect a network.",
      "Warnings without someone who must act on them change little.",
      "Separate triggers (why then) from conditions (why possible)."
    ]
  },

      var seen = data.events.filter(function (e) { return !eventIsGated(evById[e.id]) && !(placeOf[e.id] && !settled(placeOf[e.id])); }).length;

      b.appendChild(el("p", { text: (questions.length ? answered + " of " + questions.length + " questions answered · " : "") + seen + " of " + data.events.length + " events unlocked" }));

          el("span", {}, [el("b", {}, [locked ? doc.createTextNode(pending ? "Hidden until you place it" : "Locked") : inline(e.title)]),
            el("span", { text: locked ? (pending ? "A question asks where it belongs" : "Answer the question before it to unlock") : label(e.id) })])]);

      whereTop.textContent = era !== undefined ? "Part " + (era + 1) + " of " + eras.length + " · " + eras[era].label : data.title;
      whereSub.textContent = label(cur.e.id) + " · event " + (cur.i + 1) + " of " + data.events.length;

    update();
    syncPadding();
    if (endInView()) markDone();

    // ---- resume ------------------------------------------------------------
    var resumed = !!(saved.v && (Object.keys(state.ans).length || state.at));
    if (resumed) {
      var target = state.at && evById[state.at].visible ? evById[state.at] : null;

  <script>
